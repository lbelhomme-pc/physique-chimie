<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" role="img" aria-labelledby="title desc">
  <title id="title">Arbre pondéré d'un test de dépistage</title>
  <desc id="desc">L'arbre sépare d'abord la population entre personnes malades et non malades, puis entre tests positifs et négatifs. Les probabilités des branches permettent d'appliquer la formule de Bayes.</desc>
  <rect width="920" height="430" rx="24" fill="#f8fafc"/>
  <g font-family="Arial, sans-serif" fill="#0f172a">
    <text x="34" y="42" font-size="24" font-weight="700">Arbre pondéré — dépistage</text>
    <text x="34" y="70" font-size="15" fill="#475569">Exemple : prévalence 2 %, sensibilité 95 %, spécificité 90 %</text>
  </g>
  <g stroke="#64748b" stroke-width="3" fill="none">
    <path d="M110 220 L330 125"/>
    <path d="M110 220 L330 315"/>
    <path d="M365 125 L620 70"/>
    <path d="M365 125 L620 175"/>
    <path d="M365 315 L620 260"/>
    <path d="M365 315 L620 365"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="18" text-anchor="middle">
    <circle cx="110" cy="220" r="34" fill="#4f46e5"/>
    <text x="110" y="226" fill="#fff" font-weight="700">Ω</text>

    <rect x="320" y="96" width="95" height="58" rx="14" fill="#fee2e2"/>
    <text x="367" y="132" fill="#991b1b" font-weight="700">M</text>
    <rect x="320" y="286" width="95" height="58" rx="14" fill="#dcfce7"/>
    <text x="367" y="322" fill="#166534" font-weight="700">non M</text>

    <rect x="610" y="42" width="100" height="56" rx="14" fill="#dbeafe"/>
    <text x="660" y="77" fill="#1e3a8a" font-weight="700">T+</text>
    <rect x="610" y="147" width="100" height="56" rx="14" fill="#e2e8f0"/>
    <text x="660" y="182" fill="#334155" font-weight="700">T−</text>
    <rect x="610" y="232" width="100" height="56" rx="14" fill="#dbeafe"/>
    <text x="660" y="267" fill="#1e3a8a" font-weight="700">T+</text>
    <rect x="610" y="337" width="100" height="56" rx="14" fill="#e2e8f0"/>
    <text x="660" y="372" fill="#334155" font-weight="700">T−</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="16" fill="#334155">
    <text x="205" y="147">P(M)=0,02</text>
    <text x="196" y="302">P(non M)=0,98</text>
    <text x="470" y="82">P(T+|M)=0,95</text>
    <text x="470" y="176">P(T−|M)=0,05</text>
    <text x="450" y="258">P(T+|non M)=0,10</text>
    <text x="448" y="363">P(T−|non M)=0,90</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="16">
    <rect x="738" y="100" width="150" height="230" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="760" y="134" fill="#0f172a" font-weight="700">Chemins utiles</text>
    <text x="760" y="172" fill="#334155">M ∩ T+</text>
    <text x="760" y="198" fill="#4f46e5">0,02 × 0,95</text>
    <text x="760" y="224" fill="#334155">= 0,019</text>
    <text x="760" y="267" fill="#334155">non M ∩ T+</text>
    <text x="760" y="293" fill="#4f46e5">0,98 × 0,10</text>
    <text x="760" y="319" fill="#334155">= 0,098</text>
  </g>
</svg>