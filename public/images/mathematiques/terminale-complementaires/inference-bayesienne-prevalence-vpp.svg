<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" role="img" aria-labelledby="title desc">
  <title id="title">Courbe de la valeur prédictive positive en fonction de la prévalence</title>
  <desc id="desc">Pour un test de sensibilité 99 pour cent et de spécificité 99 pour cent, la valeur prédictive positive augmente fortement avec la prévalence. Elle vaut environ 50 pour cent pour une prévalence de 1 pour cent et environ 96 pour cent pour une prévalence de 20 pour cent.</desc>
  <rect width="920" height="520" rx="24" fill="#f8fafc"/>
  <g stroke="#cbd5e1" stroke-width="1">
    <path d="M100 430 H850"/><path d="M100 350 H850"/><path d="M100 270 H850"/><path d="M100 190 H850"/><path d="M100 110 H850"/>
    <path d="M100 430 V80"/><path d="M250 430 V80"/><path d="M400 430 V80"/><path d="M550 430 V80"/><path d="M700 430 V80"/><path d="M850 430 V80"/>
  </g>
  <g stroke="#334155" stroke-width="3">
    <path d="M100 430 H860"/>
    <path d="M100 440 V70"/>
  </g>
  <g font-family="Arial, sans-serif" fill="#334155" font-size="15">
    <text x="92" y="454">0</text><text x="236" y="454">10 %</text><text x="385" y="454">20 %</text><text x="535" y="454">30 %</text><text x="685" y="454">40 %</text><text x="835" y="454">50 %</text>
    <text x="58" y="435">0 %</text><text x="48" y="355">25 %</text><text x="48" y="275">50 %</text><text x="48" y="195">75 %</text><text x="40" y="115">100 %</text>
    <text x="690" y="494" font-size="17" font-weight="700">Prévalence</text>
    <text transform="translate(22 270) rotate(-90)" font-size="17" font-weight="700">Valeur prédictive positive</text>
  </g>
  <path d="M115 270 C145 220, 190 175, 250 145 C340 110, 470 96, 850 88" fill="none" stroke="#4f46e5" stroke-width="5"/>
  <circle cx="115" cy="270" r="7" fill="#dc2626"/>
  <circle cx="400" cy="122" r="7" fill="#dc2626"/>
  <g font-family="Arial, sans-serif" font-size="15" fill="#0f172a">
    <rect x="128" y="244" width="180" height="54" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="142" y="266">Prévalence 1 %</text>
    <text x="142" y="287" font-weight="700">VPP ≈ 50 %</text>
    <rect x="418" y="96" width="195" height="54" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="432" y="118">Prévalence 20 %</text>
    <text x="432" y="139" font-weight="700">VPP ≈ 96 %</text>
  </g>
  <text x="100" y="42" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#0f172a">Influence de la prévalence sur la VPP</text>
  <text x="100" y="66" font-family="Arial, sans-serif" font-size="15" fill="#475569">Test fixé : sensibilité 99 %, spécificité 99 %</text>
</svg>