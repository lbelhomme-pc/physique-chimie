<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" role="img" aria-labelledby="set-title set-desc"><title id="set-title">Intersection et réunion d'ensembles</title><desc id="set-desc">Deux ensembles A et B se recoupent, avec la zone commune mise en évidence.</desc><rect width="640" height="250" fill="none"/><circle cx="270" cy="125" r="82" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><circle cx="370" cy="125" r="82" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><path d="M320 60 A82 82 0 0 1 320 190 A82 82 0 0 1 320 60" fill="#fde68a" opacity="0.85"/><text x="230" y="125" text-anchor="middle" font-weight="700">A</text><text x="410" y="125" text-anchor="middle" font-weight="700">B</text><text x="320" y="128" text-anchor="middle" font-weight="700">A ∩ B</text><text x="320" y="225" text-anchor="middle">La réunion A ∪ B contient les deux disques.</text></svg>