<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 210" role="img" aria-labelledby="numberline-title numberline-desc"><title id="numberline-title">Intervalle centré sur 3</title><desc id="numberline-desc">Droite graduée montrant les solutions de valeur absolue entre 1 et 5.</desc><line x1="70" y1="105" x2="610" y2="105" stroke="#111827" stroke-width="3"/><line x1="190" y1="105" x2="490" y2="105" stroke="#dc2626" stroke-width="8"/><circle cx="190" cy="105" r="10" fill="#dc2626"/><circle cx="490" cy="105" r="10" fill="#dc2626"/><line x1="340" y1="80" x2="340" y2="130" stroke="#2563eb" stroke-width="3"/><text x="190" y="150" text-anchor="middle">1</text><text x="340" y="70" text-anchor="middle" font-weight="700">3</text><text x="490" y="150" text-anchor="middle">5</text><text x="340" y="185" text-anchor="middle">|x - 3| ≤ 2 correspond à [1 ; 5]</text></svg>