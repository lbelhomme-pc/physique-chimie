<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 230" role="img" aria-labelledby="algebra-title algebra-desc"><title id="algebra-title">Choisir une forme algébrique</title><desc id="algebra-desc">Trois formes d'une expression reliées à trois usages.</desc><rect x="55" y="45" width="165" height="70" rx="8" fill="#dbeafe" stroke="#2563eb"/><rect x="258" y="45" width="165" height="70" rx="8" fill="#dcfce7" stroke="#16a34a"/><rect x="461" y="45" width="165" height="70" rx="8" fill="#fef3c7" stroke="#d97706"/><text x="138" y="76" text-anchor="middle" font-weight="700">Forme factorisée</text><text x="138" y="98" text-anchor="middle">résoudre / signe</text><text x="341" y="76" text-anchor="middle" font-weight="700">Forme développée</text><text x="341" y="98" text-anchor="middle">calculer</text><text x="544" y="76" text-anchor="middle" font-weight="700">Forme réduite</text><text x="544" y="98" text-anchor="middle">comparer</text><text x="340" y="165" text-anchor="middle">(x - 2)(x + 5) = x² + 3x - 10</text></svg>