<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 210" role="img" aria-labelledby="inequality-title inequality-desc"><title id="inequality-title">Solution d'une inéquation</title><desc id="inequality-desc">Droite numérique montrant x inférieur ou égal à -2.</desc><line x1="80" y1="105" x2="600" y2="105" stroke="#111827" stroke-width="3"/><line x1="190" y1="105" x2="80" y2="105" stroke="#2563eb" stroke-width="8"/><circle cx="190" cy="105" r="11" fill="#2563eb"/><text x="190" y="145" text-anchor="middle">-2</text><text x="335" y="180" text-anchor="middle">x ≤ -2 : borne fermée, coloriage vers la gauche</text></svg>