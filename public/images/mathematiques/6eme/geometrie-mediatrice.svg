<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
<title id="title">Médiatrice d’un segment</title>
<desc id="desc">Un segment horizontal possède un milieu marqué et une droite verticale perpendiculaire passant par ce milieu. Deux arcs de compas se croisent sur la médiatrice pour illustrer l’équidistance aux extrémités.</desc>
<rect width="960" height="420" rx="24" fill="#f8fafc"/>
<text x="44" y="50" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#0f172a">Médiatrice : perpendicularité et équidistance</text>
<path d="M260 235H700" stroke="#334155" stroke-width="5"/>
<circle cx="260" cy="235" r="8" fill="#0f172a"/><circle cx="700" cy="235" r="8" fill="#0f172a"/><circle cx="480" cy="235" r="7" fill="#dc2626"/>
<path d="M480 85V360" stroke="#4f46e5" stroke-width="5"/>
<path d="M455 235V210H480" fill="none" stroke="#16a34a" stroke-width="4"/>
<path d="M260 235C340 90 620 90 700 235" fill="none" stroke="#93c5fd" stroke-width="3" stroke-dasharray="8 8"/>
<path d="M260 235C340 380 620 380 700 235" fill="none" stroke="#93c5fd" stroke-width="3" stroke-dasharray="8 8"/>
</svg>