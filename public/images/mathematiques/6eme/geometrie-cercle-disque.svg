<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
<title id="title">Cercle, disque, rayon, diamètre et corde</title>
<desc id="desc">Un disque coloré est bordé par un cercle. Le centre, un rayon, un diamètre et une corde sont représentés. Les notations mathématiques sont données en LaTeX dans le cours.</desc>
<rect width="960" height="420" rx="24" fill="#f8fafc"/>
<text x="44" y="50" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#0f172a">Cercle et disque : même centre, objets différents</text>
<circle cx="480" cy="235" r="130" fill="#dbeafe" stroke="#2563eb" stroke-width="6"/>
<circle cx="480" cy="235" r="7" fill="#0f172a"/>
<path d="M480 235L590 180" stroke="#16a34a" stroke-width="4"/>
<path d="M350 235H610" stroke="#dc2626" stroke-width="4"/>
<path d="M390 155L575 295" stroke="#f59e0b" stroke-width="4"/>
<g font-family="Arial,sans-serif" font-size="16" fill="#334155"><text x="600" y="176">rayon</text><text x="615" y="240">diamètre</text><text x="580" y="305">corde</text></g>
</svg>