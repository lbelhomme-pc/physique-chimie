<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
<title id="title">Angle et bissectrice</title>
<desc id="desc">Deux demi-droites forment un angle et une troisième demi-droite intérieure partage visuellement l’angle en deux parties égales. Les mesures et notations sont données en LaTeX dans le cours.</desc>
<rect width="960" height="420" rx="24" fill="#f8fafc"/>
<text x="44" y="50" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#0f172a">Mesurer puis partager un angle</text>
<circle cx="300" cy="300" r="7" fill="#0f172a"/>
<path d="M300 300L760 300" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
<path d="M300 300L615 90" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
<path d="M300 300L720 190" stroke="#4f46e5" stroke-width="5" stroke-dasharray="10 8"/>
<path d="M430 300A130 130 0 0 0 408 228" fill="none" stroke="#16a34a" stroke-width="5"/>
<path d="M410 226A128 128 0 0 0 385 194" fill="none" stroke="#16a34a" stroke-width="5"/>
</svg>