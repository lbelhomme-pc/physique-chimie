<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
<title id="title">Horloge analogique pour lire un horaire</title>
<desc id="desc">Horloge circulaire avec douze repères, une aiguille courte et une aiguille longue. L’horaire précis est donné en LaTeX dans le cours.</desc>
<rect width="960" height="420" rx="24" fill="#f8fafc"/>
<text x="44" y="50" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#0f172a">Lire un horaire</text>
<circle cx="480" cy="235" r="130" fill="#fff" stroke="#64748b" stroke-width="4"/>
<g stroke="#64748b" stroke-width="4">
<path d="M480 105V125"/><path d="M480 345V365"/><path d="M350 235H370"/><path d="M590 235H610"/>
</g>
<g stroke="#94a3b8" stroke-width="3">
<path d="M545 122L535 140"/><path d="M415 348L425 330"/><path d="M593 170L575 180"/><path d="M367 300L385 290"/><path d="M593 300L575 290"/><path d="M367 170L385 180"/><path d="M545 348L535 330"/><path d="M415 122L425 140"/>
</g>
<circle cx="480" cy="235" r="7" fill="#0f172a"/>
<path d="M480 235L545 185" stroke="#4f46e5" stroke-width="7" stroke-linecap="round"/>
<path d="M480 235L430 315" stroke="#dc2626" stroke-width="5" stroke-linecap="round"/>
</svg>