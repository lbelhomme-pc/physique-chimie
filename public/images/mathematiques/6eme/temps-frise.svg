<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
<title id="title">Frise chronologique pour décomposer une durée</title>
<desc id="desc">Une frise horizontale comporte quatre instants successifs reliés par trois segments de durées différentes. Les horaires et durées sont donnés en LaTeX dans le cours.</desc>
<rect width="960" height="360" rx="24" fill="#f8fafc"/>
<text x="44" y="50" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#0f172a">Décomposer une durée</text>
<path d="M120 200H840" stroke="#334155" stroke-width="5"/>
<g fill="#4f46e5"><circle cx="160" cy="200" r="11"/><circle cx="360" cy="200" r="11"/><circle cx="610" cy="200" r="11"/><circle cx="800" cy="200" r="11"/></g>
<g font-family="Arial,sans-serif" font-size="16" text-anchor="middle" fill="#475569"><text x="160" y="245">départ</text><text x="360" y="245">repère</text><text x="610" y="245">repère</text><text x="800" y="245">arrivée</text></g>
<path d="M160 155H360" stroke="#60a5fa" stroke-width="4"/><path d="M360 155H610" stroke="#16a34a" stroke-width="4"/><path d="M610 155H800" stroke="#f59e0b" stroke-width="4"/>
</svg>