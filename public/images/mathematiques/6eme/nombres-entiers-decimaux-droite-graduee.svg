<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">Demi-droite graduée pour comparer et encadrer des nombres décimaux</title>
  <desc id="desc">Demi-droite horizontale comportant des graduations régulières, trois points repérés A, B et C et une zone mise en évidence entre deux graduations consécutives. Les abscisses exactes sont données en LaTeX dans le cours.</desc>
  <rect width="960" height="360" rx="24" fill="#f8fafc"/>
  <text x="44" y="48" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#0f172a">Comparer, placer, encadrer</text>
  <text x="44" y="78" font-family="Arial, sans-serif" font-size="15" fill="#475569">Une graduation régulière permet de lire l’ordre des nombres.</text>
  <rect x="360" y="142" width="205" height="88" rx="16" fill="#eef2ff"/>
  <path d="M90 190 H870" stroke="#334155" stroke-width="4"/>
  <path d="M860 180 L880 190 L860 200" fill="none" stroke="#334155" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <g stroke="#64748b" stroke-width="3">
    <path d="M130 168 V212"/><path d="M225 168 V212"/><path d="M320 168 V212"/>
    <path d="M415 168 V212"/><path d="M510 168 V212"/><path d="M605 168 V212"/>
    <path d="M700 168 V212"/><path d="M795 168 V212"/>
  </g>
  <g>
    <circle cx="225" cy="190" r="10" fill="#4f46e5"/>
    <circle cx="455" cy="190" r="10" fill="#16a34a"/>
    <circle cx="700" cy="190" r="10" fill="#dc2626"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">
    <text x="225" y="150" fill="#3730a3">A</text>
    <text x="455" y="150" fill="#166534">B</text>
    <text x="700" y="150" fill="#991b1b">C</text>
  </g>
  <text x="362" y="258" font-family="Arial, sans-serif" font-size="14" fill="#475569">Zone d’encadrement étudiée dans l’exemple du cours</text>
</svg>