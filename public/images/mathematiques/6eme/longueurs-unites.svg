<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
<title id="title">Échelle visuelle des unités de longueur</title>
<desc id="desc">Suite de sept cases reliées de la plus grande unité à la plus petite, utilisée pour visualiser les changements d’échelle entre kilomètres, hectomètres, décamètres, mètres, décimètres, centimètres et millimètres. Les égalités numériques sont données en LaTeX dans le cours.</desc>
<rect width="960" height="360" rx="24" fill="#f8fafc"/>
<text x="44" y="48" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#0f172a">Changer d’unité sans changer la longueur</text>
<g transform="translate(52 130)" font-family="Arial,sans-serif" text-anchor="middle">
<g fill="#ffffff" stroke="#94a3b8" stroke-width="2">
<rect x="0" y="0" width="112" height="78" rx="12"/><rect x="122" y="0" width="112" height="78" rx="12"/><rect x="244" y="0" width="112" height="78" rx="12"/>
<rect x="366" y="0" width="112" height="78" rx="12"/><rect x="488" y="0" width="112" height="78" rx="12"/><rect x="610" y="0" width="112" height="78" rx="12"/><rect x="732" y="0" width="112" height="78" rx="12"/>
</g>
<g fill="#334155" font-size="18" font-weight="700"><text x="56" y="46">km</text><text x="178" y="46">hm</text><text x="300" y="46">dam</text><text x="422" y="46">m</text><text x="544" y="46">dm</text><text x="666" y="46">cm</text><text x="788" y="46">mm</text></g>
<g stroke="#4f46e5" stroke-width="3"><path d="M112 39H122"/><path d="M234 39H244"/><path d="M356 39H366"/><path d="M478 39H488"/><path d="M600 39H610"/><path d="M722 39H732"/></g>
</g>
</svg>