<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
<title id="title">Tableau de proportionnalité entre quantité et prix</title>
<desc id="desc">Tableau à deux lignes représentant une quantité et un prix, avec des flèches de multiplication et d’addition pour illustrer plusieurs raisonnements de proportionnalité.</desc>
<rect width="960" height="420" rx="24" fill="#f8fafc"/>
<text x="44" y="50" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#0f172a">Relier deux grandeurs sans recette unique</text>
<g transform="translate(120 115)" font-family="Arial,sans-serif">
<rect x="0" y="0" width="720" height="160" rx="10" fill="#fff" stroke="#94a3b8" stroke-width="3"/>
<path d="M0 80H720M180 0V160M360 0V160M540 0V160" stroke="#cbd5e1" stroke-width="2"/>
<g text-anchor="middle" fill="#334155" font-size="17" font-weight="700">
<text x="90" y="48">Quantité</text><text x="90" y="128">Prix</text>
<text x="270" y="48">A</text><text x="450" y="48">B</text><text x="630" y="48">C</text>
<text x="270" y="128">A'</text><text x="450" y="128">B'</text><text x="630" y="128">C'</text>
</g>
</g>
<path d="M280 310H430" stroke="#4f46e5" stroke-width="4" marker-end="url(#arrow)"/>
<path d="M525 310H675" stroke="#16a34a" stroke-width="4" marker-end="url(#arrow)"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#4f46e5"/></marker></defs>
<text x="480" y="365" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#64748b">On choisit le raisonnement le plus simple : multiplier, additionner des colonnes ou revenir à l’unité.</text>
</svg>