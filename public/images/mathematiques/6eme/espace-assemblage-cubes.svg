<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
<title id="title">Assemblage de cubes vu en perspective</title>
<desc id="desc">Assemblage de cubes unité disposés sur deux niveaux pour travailler le passage entre objet de l’espace et représentation plane.</desc>
<rect width="960" height="420" rx="24" fill="#f8fafc"/>
<text x="44" y="50" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#0f172a">Voir un assemblage de cubes dans l’espace</text>
<g transform="translate(250 115)" stroke="#4f46e5" stroke-width="2">
  <g fill="#e0e7ff">
    <path d="M0 100L60 65L120 100L60 135Z"/><path d="M60 135L120 100V165L60 200Z"/><path d="M0 100L60 135V200L0 165Z"/>
    <path d="M120 100L180 65L240 100L180 135Z"/><path d="M180 135L240 100V165L180 200Z"/><path d="M120 100L180 135V200L120 165Z"/>
    <path d="M240 100L300 65L360 100L300 135Z"/><path d="M300 135L360 100V165L300 200Z"/><path d="M240 100L300 135V200L240 165Z"/>
  </g>
  <g fill="#c7d2fe">
    <path d="M60 65L120 30L180 65L120 100Z"/><path d="M120 100L180 65V130L120 165Z"/><path d="M60 65L120 100V165L60 130Z"/>
    <path d="M180 65L240 30L300 65L240 100Z"/><path d="M240 100L300 65V130L240 165Z"/><path d="M180 65L240 100V165L180 130Z"/>
  </g>
</g>
<text x="480" y="365" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#64748b">Certaines faces sont visibles ; d’autres cubes peuvent être partiellement cachés.</text>
</svg>