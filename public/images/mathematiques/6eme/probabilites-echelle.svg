<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
<title id="title">Échelle de probabilité entre zéro et un</title>
<desc id="desc">Une droite graduée va de impossible à certain, avec plusieurs repères intermédiaires pour situer des probabilités.</desc>
<rect width="960" height="360" rx="24" fill="#f8fafc"/>
<text x="44" y="50" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#0f172a">Une probabilité se situe entre impossible et certain</text>
<path d="M120 190H840" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
<g stroke="#64748b" stroke-width="4"><path d="M120 165V215"/><path d="M300 172V208"/><path d="M480 165V215"/><path d="M660 172V208"/><path d="M840 165V215"/></g>
<g font-family="Arial,sans-serif" text-anchor="middle">
<text x="120" y="250" font-size="18" font-weight="700" fill="#dc2626">impossible</text>
<text x="480" y="250" font-size="18" font-weight="700" fill="#d97706">une chance sur deux</text>
<text x="840" y="250" font-size="18" font-weight="700" fill="#16a34a">certain</text>
</g>
<circle cx="300" cy="190" r="10" fill="#6366f1"/><circle cx="660" cy="190" r="10" fill="#6366f1"/>
</svg>