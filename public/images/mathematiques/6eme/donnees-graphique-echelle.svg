<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
<title id="title">Deux diagrammes en barres avec des échelles différentes</title>
<desc id="desc">Deux graphiques représentent des valeurs proches mais utilisent des échelles verticales différentes pour illustrer l’importance de lire les axes.</desc>
<rect width="960" height="420" rx="24" fill="#f8fafc"/>
<text x="44" y="50" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#0f172a">Un graphique doit toujours être lu avec son échelle</text>
<g transform="translate(80 95)">
  <text x="170" y="20" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#334155">Échelle large</text>
  <path d="M40 250V55M40 250H330" stroke="#64748b" stroke-width="3"/>
  <rect x="85" y="155" width="70" height="95" fill="#bfdbfe"/><rect x="205" y="135" width="70" height="115" fill="#93c5fd"/>
</g>
<g transform="translate(535 95)">
  <text x="170" y="20" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#334155">Échelle resserrée</text>
  <path d="M40 250V55M40 250H330" stroke="#64748b" stroke-width="3"/>
  <rect x="85" y="205" width="70" height="45" fill="#fecaca"/><rect x="205" y="85" width="70" height="165" fill="#fca5a5"/>
</g>
<text x="480" y="385" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#64748b">La différence visuelle dépend du choix de l’échelle ; les valeurs doivent être lues avant d’interpréter.</text>
</svg>