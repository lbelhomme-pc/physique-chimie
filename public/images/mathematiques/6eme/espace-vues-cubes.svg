<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
<title id="title">Vues de dessus et de face d’un assemblage de cubes</title>
<desc id="desc">Deux grilles schématiques montrent une vue de dessus et une vue de face du même type d’assemblage de cubes.</desc>
<rect width="960" height="420" rx="24" fill="#f8fafc"/>
<text x="44" y="50" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#0f172a">Passer d’une vue à une autre</text>
<g transform="translate(120 110)">
  <text x="150" y="0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#334155">Vue de dessus</text>
  <g transform="translate(30 35)" fill="#dbeafe" stroke="#2563eb" stroke-width="3">
    <rect x="0" y="0" width="75" height="75"/><rect x="75" y="0" width="75" height="75"/><rect x="150" y="0" width="75" height="75"/>
    <rect x="0" y="75" width="75" height="75"/><rect x="75" y="75" width="75" height="75"/>
  </g>
</g>
<g transform="translate(545 110)">
  <text x="150" y="0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#334155">Vue de face</text>
  <g transform="translate(30 35)" fill="#dcfce7" stroke="#16a34a" stroke-width="3">
    <rect x="0" y="75" width="75" height="75"/><rect x="75" y="75" width="75" height="75"/><rect x="150" y="75" width="75" height="75"/>
    <rect x="75" y="0" width="75" height="75"/><rect x="150" y="0" width="75" height="75"/>
  </g>
</g>
<text x="480" y="355" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#64748b">Une seule vue ne donne pas toujours toutes les informations sur le solide.</text>
</svg>