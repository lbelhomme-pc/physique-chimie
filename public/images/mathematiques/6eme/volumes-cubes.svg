<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
<title id="title">Assemblage de cubes unité</title>
<desc id="desc">Plusieurs cubes identiques sont organisés en couches pour visualiser un volume comme dénombrement d’unités cubiques. Les dimensions et nombres de cubes sont donnés en LaTeX dans le cours.</desc>
<rect width="960" height="430" rx="24" fill="#f8fafc"/>
<text x="44" y="50" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#0f172a">Le volume compte des unités cubiques</text>
<g transform="translate(250 125)" stroke="#4f46e5" stroke-width="2">
  <g fill="#e0e7ff">
    <path d="M0 80L60 45L120 80L60 115Z"/><path d="M60 115L120 80V145L60 180Z"/><path d="M0 80L60 115V180L0 145Z"/>
    <path d="M120 80L180 45L240 80L180 115Z"/><path d="M180 115L240 80V145L180 180Z"/><path d="M120 80L180 115V180L120 145Z"/>
    <path d="M240 80L300 45L360 80L300 115Z"/><path d="M300 115L360 80V145L300 180Z"/><path d="M240 80L300 115V180L240 145Z"/>
  </g>
  <g fill="#c7d2fe">
    <path d="M60 45L120 10L180 45L120 80Z"/><path d="M120 80L180 45V110L120 145Z"/><path d="M60 45L120 80V145L60 110Z"/>
    <path d="M180 45L240 10L300 45L240 80Z"/><path d="M240 80L300 45V110L240 145Z"/><path d="M180 45L240 80V145L180 110Z"/>
  </g>
</g>
</svg>