<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
<title id="title">Représentation d’un partage en parts égales</title>
<desc id="desc">Trois bandes de même longueur sont chacune partagées en quatre parts égales. Certaines parts sont mises en évidence pour illustrer le lien entre partage, fraction et quotient. Les valeurs mathématiques précises sont données en LaTeX dans le cours.</desc>
<rect width="960" height="420" rx="24" fill="#f8fafc"/>
<text x="44" y="48" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#0f172a">Partager pour comprendre le quotient</text>
<text x="44" y="80" font-family="Arial,sans-serif" font-size="15" fill="#475569">Chaque bande représente une même unité de longueur.</text>
<g transform="translate(90 125)">
  <g fill="#ffffff" stroke="#94a3b8" stroke-width="2">
    <rect x="0" y="0" width="720" height="62" rx="8"/>
    <rect x="0" y="82" width="720" height="62" rx="8"/>
    <rect x="0" y="164" width="720" height="62" rx="8"/>
  </g>
  <g stroke="#94a3b8" stroke-width="2">
    <path d="M180 0V62"/><path d="M360 0V62"/><path d="M540 0V62"/>
    <path d="M180 82V144"/><path d="M360 82V144"/><path d="M540 82V144"/>
    <path d="M180 164V226"/><path d="M360 164V226"/><path d="M540 164V226"/>
  </g>
  <g fill="#c7d2fe">
    <rect x="0" y="0" width="180" height="62" rx="8"/>
    <rect x="0" y="82" width="180" height="62" rx="8"/>
    <rect x="0" y="164" width="180" height="62" rx="8"/>
  </g>
</g>
<text x="90" y="382" font-family="Arial,sans-serif" font-size="14" fill="#64748b">Le schéma matérialise des parts égales ; les écritures fractionnaires sont fournies dans le texte associé.</text>
</svg>