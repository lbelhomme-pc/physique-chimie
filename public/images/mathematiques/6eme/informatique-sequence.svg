<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
<title id="title">Séquence d’instructions pour déplacer un robot</title>
<desc id="desc">Une grille montre un robot, une cible et une suite de flèches représentant les instructions avancer et tourner.</desc>
<rect width="960" height="420" rx="24" fill="#f8fafc"/>
<text x="44" y="50" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#0f172a">Une séquence donne des instructions dans un ordre précis</text>
<g transform="translate(100 100)" stroke="#cbd5e1" stroke-width="2">
<rect x="0" y="0" width="300" height="240" fill="#fff" stroke="#64748b" stroke-width="3"/>
<path d="M60 0V240M120 0V240M180 0V240M240 0V240M0 60H300M0 120H300M0 180H300"/>
<circle cx="30" cy="210" r="20" fill="#4f46e5"/>
<path d="M30 194L43 218H17Z" fill="#fff"/>
<circle cx="270" cy="30" r="18" fill="#16a34a"/><path d="M260 30L268 38L282 20" fill="none" stroke="#fff" stroke-width="4"/>
</g>
<g transform="translate(470 120)" font-family="Arial,sans-serif">
<rect x="0" y="0" width="380" height="190" rx="18" fill="#eef2ff" stroke="#818cf8" stroke-width="3"/>
<text x="190" y="38" text-anchor="middle" font-size="18" font-weight="700" fill="#334155">Séquence</text>
<g fill="#4f46e5"><path d="M55 85H115L95 65M115 85L95 105" stroke="#4f46e5" stroke-width="6" fill="none"/><path d="M145 85H205L185 65M205 85L185 105" stroke="#4f46e5" stroke-width="6" fill="none"/><path d="M235 85H295L275 65M295 85L275 105" stroke="#4f46e5" stroke-width="6" fill="none"/></g>
<text x="190" y="150" text-anchor="middle" font-size="15" fill="#64748b">Chaque instruction est exécutée dans l’ordre.</text>
</g>
</svg>