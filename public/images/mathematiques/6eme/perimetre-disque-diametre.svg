<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
<title id="title">Disque avec rayon et diamètre repérés</title>
<desc id="desc">Un disque est représenté avec son centre, un segment de rayon et un segment de diamètre. Le contour est mis en évidence pour relier diamètre et périmètre. Les symboles et formules sont donnés en LaTeX dans le cours.</desc>
<rect width="960" height="420" rx="24" fill="#f8fafc"/>
<text x="44" y="50" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#0f172a">Le périmètre d’un disque dépend de son diamètre</text>
<circle cx="480" cy="235" r="125" fill="#eef2ff" stroke="#4f46e5" stroke-width="7"/>
<circle cx="480" cy="235" r="6" fill="#0f172a"/>
<path d="M355 235H605" stroke="#dc2626" stroke-width="4"/>
<path d="M480 235L560 140" stroke="#16a34a" stroke-width="4"/>
<g font-family="Arial,sans-serif" fill="#334155" font-size="16"><text x="334" y="258">diamètre</text><text x="548" y="132">rayon</text><text x="620" y="180">contour</text></g>
<path d="M614 187C645 195 662 208 676 229" fill="none" stroke="#64748b" stroke-width="2"/>
</svg>