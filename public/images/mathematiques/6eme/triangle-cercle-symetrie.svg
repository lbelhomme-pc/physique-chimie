<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="title desc">
<title id="title">Triangle inscrit dans son cercle circonscrit</title>
<desc id="desc">Un triangle est représenté à l’intérieur d’un cercle passant par ses trois sommets. Trois médiatrices convergent au centre du cercle. À droite, un axe vertical illustre deux points symétriques.</desc>
<rect width="960" height="440" rx="24" fill="#f8fafc"/>
<text x="44" y="50" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#0f172a">Médiatrices, cercle circonscrit et symétrie</text>
<g transform="translate(80 80)">
<circle cx="250" cy="190" r="140" fill="#eef2ff" stroke="#6366f1" stroke-width="4"/>
<path d="M135 245L250 55L365 245Z" fill="none" stroke="#1e3a8a" stroke-width="5"/>
<path d="M250 35V320" stroke="#93c5fd" stroke-width="3" stroke-dasharray="8 8"/>
<path d="M95 145L405 235" stroke="#93c5fd" stroke-width="3" stroke-dasharray="8 8"/>
<path d="M405 145L95 235" stroke="#93c5fd" stroke-width="3" stroke-dasharray="8 8"/>
<circle cx="250" cy="190" r="7" fill="#dc2626"/>
</g>
<g transform="translate(620 95)">
<path d="M100 0V280" stroke="#4f46e5" stroke-width="5"/>
<circle cx="35" cy="130" r="10" fill="#16a34a"/><circle cx="165" cy="130" r="10" fill="#dc2626"/>
<path d="M35 130H165" stroke="#64748b" stroke-width="3" stroke-dasharray="7 7"/>
</g>
</svg>