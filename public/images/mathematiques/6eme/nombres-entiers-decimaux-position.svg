<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">Tableau de numération décimale de position</title>
  <desc id="desc">Tableau visuel séparant les rangs de la partie entière et de la partie décimale. Une ligne verticale renforcée matérialise la séparation entre unités et dixièmes. Les valeurs numériques sont données en LaTeX dans la légende du cours.</desc>
  <rect width="960" height="360" rx="24" fill="#f8fafc"/>
  <text x="44" y="48" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#0f172a">Tableau de numération</text>
  <text x="44" y="78" font-family="Arial, sans-serif" font-size="15" fill="#475569">La position d’un chiffre détermine sa valeur.</text>
  <g transform="translate(54 118)">
    <rect width="852" height="170" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <g stroke="#cbd5e1" stroke-width="2">
      <path d="M142 0 V170"/><path d="M284 0 V170"/><path d="M426 0 V170"/>
      <path d="M568 0 V170"/><path d="M710 0 V170"/>
      <path d="M0 72 H852"/>
    </g>
    <path d="M426 0 V170" stroke="#4f46e5" stroke-width="5"/>
    <g font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#334155">
      <text x="71" y="34">milliers</text>
      <text x="213" y="34">centaines</text>
      <text x="355" y="34">dizaines</text>
      <text x="497" y="34">unités</text>
      <text x="639" y="34">dixièmes</text>
      <text x="781" y="34">centièmes</text>
      <text x="497" y="62" fill="#4f46e5" font-weight="700">partie entière</text>
      <text x="710" y="62" fill="#4f46e5" font-weight="700">partie décimale</text>
    </g>
    <g fill="#e0e7ff">
      <rect x="24" y="94" width="94" height="50" rx="12"/>
      <rect x="166" y="94" width="94" height="50" rx="12"/>
      <rect x="308" y="94" width="94" height="50" rx="12"/>
      <rect x="450" y="94" width="94" height="50" rx="12"/>
      <rect x="592" y="94" width="94" height="50" rx="12"/>
      <rect x="734" y="94" width="94" height="50" rx="12"/>
    </g>
  </g>
  <g font-family="Arial, sans-serif" font-size="14" fill="#64748b">
    <text x="54" y="324">Les cases représentent les rangs ; les chiffres de l’exemple sont fournis dans le texte mathématique associé.</text>
  </g>
</svg>