<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
<title id="title">Motif évolutif construit avec des carrés</title>
<desc id="desc">Quatre étapes successives d’un motif formé de carrés montrent une croissance régulière. Les nombres d’éléments sont donnés en LaTeX dans le texte du cours.</desc>
<rect width="960" height="420" rx="24" fill="#f8fafc"/>
<text x="44" y="50" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#0f172a">Observer ce qui change d’une étape à l’autre</text>
<g transform="translate(80 120)" fill="#dbeafe" stroke="#2563eb" stroke-width="2">
<rect x="0" y="90" width="48" height="48"/>
<rect x="180" y="90" width="48" height="48"/><rect x="228" y="90" width="48" height="48"/>
<rect x="390" y="90" width="48" height="48"/><rect x="438" y="90" width="48" height="48"/><rect x="486" y="90" width="48" height="48"/>
<rect x="620" y="90" width="48" height="48"/><rect x="668" y="90" width="48" height="48"/><rect x="716" y="90" width="48" height="48"/><rect x="764" y="90" width="48" height="48"/>
</g>
<g font-family="Arial,sans-serif" font-size="16" text-anchor="middle" fill="#475569">
<text x="104" y="320">étape</text><text x="284" y="320">étape</text><text x="510" y="320">étape</text><text x="820" y="320">étape</text>
</g>
</svg>