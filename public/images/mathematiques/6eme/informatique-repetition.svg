<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
<title id="title">Répétition d’une séquence pour tracer un parcours</title>
<desc id="desc">À gauche quatre blocs identiques sont répétés ; à droite un seul bloc est placé dans une structure répéter plusieurs fois, illustrant la simplification d’un algorithme.</desc>
<rect width="960" height="420" rx="24" fill="#f8fafc"/>
<text x="44" y="50" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#0f172a">Répéter évite de recopier la même séquence</text>
<g transform="translate(80 105)" font-family="Arial,sans-serif">
<text x="175" y="0" text-anchor="middle" font-size="18" font-weight="700" fill="#334155">Sans répétition</text>
<g fill="#dbeafe" stroke="#2563eb" stroke-width="2">
<rect x="30" y="35" width="290" height="44" rx="10"/><rect x="30" y="88" width="290" height="44" rx="10"/>
<rect x="30" y="141" width="290" height="44" rx="10"/><rect x="30" y="194" width="290" height="44" rx="10"/>
</g>
<g text-anchor="middle" fill="#334155" font-size="15"><text x="175" y="63">avancer puis tourner</text><text x="175" y="116">avancer puis tourner</text><text x="175" y="169">avancer puis tourner</text><text x="175" y="222">avancer puis tourner</text></g>
</g>
<g transform="translate(540 105)" font-family="Arial,sans-serif">
<text x="175" y="0" text-anchor="middle" font-size="18" font-weight="700" fill="#334155">Avec répétition</text>
<rect x="25" y="35" width="300" height="210" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
<text x="175" y="73" text-anchor="middle" font-size="17" font-weight="700" fill="#166534">répéter</text>
<rect x="60" y="100" width="230" height="60" rx="12" fill="#fff" stroke="#86efac" stroke-width="2"/>
<text x="175" y="136" text-anchor="middle" font-size="15" fill="#334155">avancer puis tourner</text>
<text x="175" y="205" text-anchor="middle" font-size="15" fill="#64748b">même action, plusieurs exécutions</text>
</g>
</svg>