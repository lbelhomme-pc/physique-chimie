<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" role="img" aria-labelledby="title desc">
<title id="title">Demi-droite graduée adaptée au placement de fractions</title>
<desc id="desc">Demi-droite horizontale divisée en intervalles égaux entre plusieurs repères entiers non chiffrés. Trois points colorés sont placés sur des graduations intermédiaires. Leurs abscisses fractionnaires sont données en LaTeX dans le cours.</desc>
<rect width="960" height="390" rx="24" fill="#f8fafc"/>
<text x="44" y="50" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#0f172a">Fractions sur une demi-droite graduée</text>
<text x="44" y="82" font-family="Arial,sans-serif" font-size="15" fill="#475569">La graduation doit être compatible avec le dénominateur.</text>
<path d="M100 220H860" stroke="#334155" stroke-width="4"/>
<path d="M850 210L872 220L850 230" fill="none" stroke="#334155" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<g stroke="#64748b" stroke-width="3">
  <path d="M120 185V255"/><path d="M200 198V242"/><path d="M280 198V242"/><path d="M360 198V242"/>
  <path d="M440 185V255"/><path d="M520 198V242"/><path d="M600 198V242"/><path d="M680 198V242"/>
  <path d="M760 185V255"/>
</g>
<circle cx="280" cy="220" r="10" fill="#4f46e5"/>
<circle cx="520" cy="220" r="10" fill="#16a34a"/>
<circle cx="680" cy="220" r="10" fill="#dc2626"/>
<text x="100" y="325" font-family="Arial,sans-serif" font-size="14" fill="#64748b">Les grands traits marquent les unités ; les petits traits partagent chaque unité en parts égales.</text>
</svg>