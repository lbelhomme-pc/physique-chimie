<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
<title id="title">Rectangle pavé de carrés unité</title>
<desc id="desc">Un rectangle est découpé en carrés unité organisés en lignes et colonnes pour visualiser l’aire comme nombre d’unités carrées. Les dimensions numériques sont données en LaTeX dans le cours.</desc>
<rect width="960" height="400" rx="24" fill="#f8fafc"/>
<text x="44" y="50" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#0f172a">L’aire compte des unités carrées</text>
<g transform="translate(200 105)" fill="#dbeafe" stroke="#60a5fa" stroke-width="2">
<rect x="0" y="0" width="560" height="210" rx="8"/>
<g stroke="#2563eb"><path d="M80 0V210"/><path d="M160 0V210"/><path d="M240 0V210"/><path d="M320 0V210"/><path d="M400 0V210"/><path d="M480 0V210"/><path d="M0 70H560"/><path d="M0 140H560"/></g>
</g>
</svg>