<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
<title id="title">Fréquences observées lors de répétitions d’une expérience aléatoire</title>
<desc id="desc">Un graphique schématique montre une fréquence qui fluctue lors des premières répétitions puis se rapproche d’un niveau de référence théorique.</desc>
<rect width="960" height="420" rx="24" fill="#f8fafc"/>
<text x="44" y="50" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#0f172a">Répéter une expérience : la fréquence fluctue</text>
<g transform="translate(100 90)">
<path d="M40 270V20M40 270H740" stroke="#64748b" stroke-width="3"/>
<path d="M40 145H740" stroke="#16a34a" stroke-width="3" stroke-dasharray="10 8"/>
<polyline points="55,70 105,205 155,115 205,175 255,130 305,160 355,137 405,151 455,140 505,148 555,142 605,146 655,143 715,145" fill="none" stroke="#4f46e5" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<g fill="#4f46e5">
<circle cx="55" cy="70" r="6"/><circle cx="105" cy="205" r="6"/><circle cx="205" cy="175" r="6"/><circle cx="355" cy="137" r="6"/><circle cx="555" cy="142" r="6"/><circle cx="715" cy="145" r="6"/>
</g>
<text x="680" y="132" font-family="Arial,sans-serif" font-size="15" fill="#15803d">référence théorique</text>
<text x="390" y="315" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#64748b">nombre de répétitions</text>
</g>
</svg>