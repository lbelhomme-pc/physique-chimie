<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
<title id="title">Étapes d’une enquête et tableau de données</title>
<desc id="desc">Schéma montrant les étapes question, collecte, tableau, lecture et choix, accompagné d’un petit tableau de données fictives.</desc>
<rect width="960" height="420" rx="24" fill="#f8fafc"/>
<text x="44" y="50" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#0f172a">De la question aux données exploitables</text>
<g font-family="Arial,sans-serif" text-anchor="middle">
  <g fill="#e0e7ff" stroke="#6366f1" stroke-width="2">
    <rect x="50" y="100" width="150" height="70" rx="14"/><rect x="230" y="100" width="150" height="70" rx="14"/>
    <rect x="410" y="100" width="150" height="70" rx="14"/><rect x="590" y="100" width="150" height="70" rx="14"/>
    <rect x="770" y="100" width="140" height="70" rx="14"/>
  </g>
  <g fill="#334155" font-size="16" font-weight="700">
    <text x="125" y="142">Question</text><text x="305" y="142">Collecte</text><text x="485" y="142">Tableau</text><text x="665" y="142">Lecture</text><text x="840" y="142">Choix</text>
  </g>
</g>
<g stroke="#64748b" stroke-width="3"><path d="M200 135H230"/><path d="M380 135H410"/><path d="M560 135H590"/><path d="M740 135H770"/></g>
<g transform="translate(235 235)" font-family="Arial,sans-serif" font-size="15">
  <rect x="0" y="0" width="490" height="120" rx="8" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
  <path d="M0 40H490M0 80H490M160 0V120M330 0V120" stroke="#cbd5e1" stroke-width="2"/>
  <text x="80" y="26" text-anchor="middle" fill="#334155" font-weight="700">Élève</text>
  <text x="245" y="26" text-anchor="middle" fill="#334155" font-weight="700">Trajet</text>
  <text x="410" y="26" text-anchor="middle" fill="#334155" font-weight="700">Durée</text>
  <text x="80" y="66" text-anchor="middle" fill="#64748b">A</text><text x="245" y="66" text-anchor="middle" fill="#64748b">vélo</text><text x="410" y="66" text-anchor="middle" fill="#64748b">courte</text>
  <text x="80" y="106" text-anchor="middle" fill="#64748b">B</text><text x="245" y="106" text-anchor="middle" fill="#64748b">bus</text><text x="410" y="106" text-anchor="middle" fill="#64748b">longue</text>
</g>
</svg>