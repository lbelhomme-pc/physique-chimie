<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
<title id="title">Carte simplifiée et distance réelle</title>
<desc id="desc">Une carte rectangulaire contient deux points reliés par un segment ; une flèche relie la distance mesurée sur la carte à une distance réelle plus grande.</desc>
<rect width="960" height="420" rx="24" fill="#f8fafc"/>
<text x="44" y="50" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#0f172a">Une échelle relie une distance sur le plan à une distance réelle</text>
<g transform="translate(100 110)">
<rect x="0" y="0" width="410" height="220" rx="18" fill="#ecfeff" stroke="#0891b2" stroke-width="4"/>
<path d="M55 170C120 70 220 200 350 65" fill="none" stroke="#67e8f9" stroke-width="12" opacity="0.8"/>
<circle cx="95" cy="150" r="10" fill="#dc2626"/><circle cx="320" cy="90" r="10" fill="#16a34a"/>
<path d="M95 150L320 90" stroke="#334155" stroke-width="4" stroke-dasharray="8 7"/>
<text x="80" y="195" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#334155">A</text>
<text x="328" y="80" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#334155">B</text>
</g>
<path d="M560 220H800" stroke="#4f46e5" stroke-width="5"/>
<path d="M790 208L815 220L790 232" fill="none" stroke="#4f46e5" stroke-width="5"/>
<text x="680" y="185" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#334155">même facteur</text>
<text x="680" y="265" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#64748b">distance sur la carte → distance réelle</text>
</svg>