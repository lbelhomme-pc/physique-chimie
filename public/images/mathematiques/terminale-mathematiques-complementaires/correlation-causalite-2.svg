<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="title desc"><title id="title">Interpolation et extrapolation</title><desc id="desc">La zone de données est encadrée et la droite se prolonge au-delà dans une zone d'extrapolation.</desc><rect width="900" height="440" rx="24" fill="#fff"/><rect x="180" y="70" width="420" height="280" fill="#dbeafe" opacity="0.55"/><line x1="100" y1="340" x2="820" y2="340" stroke="#111827" stroke-width="3"/><line x1="120" y1="385" x2="120" y2="55" stroke="#111827" stroke-width="3"/><line x1="140" y1="310" x2="790" y2="90" stroke="#dc2626" stroke-width="5"/><text x="310" y="95" font-size="22">zone observée</text><text x="650" y="155" font-size="22">extrapolation</text></svg>