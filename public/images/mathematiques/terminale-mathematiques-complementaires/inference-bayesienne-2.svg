<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="title desc"><title id="title">Fréquence de base et tests positifs</title><desc id="desc">Deux barres comparent vrais positifs et faux positifs lorsque l'événement est rare.</desc><rect width="900" height="440" rx="24" fill="#fff"/><line x1="100" y1="360" x2="820" y2="360" stroke="#111827" stroke-width="3"/><rect x="210" y="285" width="150" height="75" fill="#2563eb"/><rect x="520" y="110" width="150" height="250" fill="#dc2626"/><text x="205" y="395" font-size="22">vrais positifs</text><text x="510" y="395" font-size="22">faux positifs</text><text x="150" y="65" font-size="24">Effet d'une faible fréquence de base</text></svg>