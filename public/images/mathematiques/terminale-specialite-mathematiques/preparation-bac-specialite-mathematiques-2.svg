<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" role="img" aria-labelledby="title desc"><title id="title">Carte de décision de spécialité</title><desc id="desc">Quatre branches relient analyse, probabilités, géométrie et algorithmique à leurs réflexes de résolution.</desc><rect width="900" height="460" rx="24" fill="#fff"/><circle cx="450" cy="225" r="78" fill="#e0e7ff" stroke="#4f46e5" stroke-width="4"/><text x="395" y="218" font-size="22">question</text><text x="382" y="247" font-size="22">de bac</text><rect x="75" y="65" width="230" height="100" rx="18" fill="#dbeafe"/><text x="120" y="105" font-size="22">Analyse</text><text x="95" y="135" font-size="18">domaine → dérivée → signe</text><rect x="595" y="65" width="230" height="100" rx="18" fill="#d1fae5"/><text x="645" y="105" font-size="22">Probabilités</text><text x="620" y="135" font-size="18">modèle → événement → calcul</text><rect x="75" y="305" width="230" height="100" rx="18" fill="#fef3c7"/><text x="115" y="345" font-size="22">Géométrie</text><text x="95" y="375" font-size="18">vecteurs → équations → contrôle</text><rect x="595" y="305" width="230" height="100" rx="18" fill="#fee2e2"/><text x="635" y="345" font-size="22">Algorithmique</text><text x="620" y="375" font-size="18">variables → boucle → sortie</text><g stroke="#111827" stroke-width="4"><line x1="385" y1="180" x2="305" y2="145"/><line x1="515" y1="180" x2="595" y2="145"/><line x1="385" y1="270" x2="305" y2="335"/><line x1="515" y1="270" x2="595" y2="335"/></g></svg>