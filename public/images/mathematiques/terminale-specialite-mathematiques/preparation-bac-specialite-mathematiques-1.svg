<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc"><title id="title">Frise de gestion des quatre heures</title><desc id="desc">Répartition indicative du temps entre lecture, résolution, reprises et vérification finale.</desc><rect width="900" height="420" rx="24" fill="#fff"/><text x="70" y="80" font-size="30">4 h de composition</text><rect x="70" y="145" width="110" height="95" rx="12" fill="#dbeafe"/><rect x="185" y="145" width="210" height="95" rx="12" fill="#d1fae5"/><rect x="400" y="145" width="210" height="95" rx="12" fill="#fef3c7"/><rect x="615" y="145" width="135" height="95" rx="12" fill="#ede9fe"/><rect x="755" y="145" width="80" height="95" rx="12" fill="#fee2e2"/><text x="90" y="185" font-size="20">lecture</text><text x="90" y="215" font-size="18">repérage</text><text x="230" y="195" font-size="22">résolution 1</text><text x="445" y="195" font-size="22">résolution 2</text><text x="640" y="185" font-size="19">reprises</text><text x="765" y="185" font-size="17">contrôle</text><line x1="70" y1="285" x2="835" y2="285" stroke="#111827" stroke-width="4"/><text x="65" y="320" font-size="18">début</text><text x="800" y="320" font-size="18">fin</text></svg>