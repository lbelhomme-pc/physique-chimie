<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" aria-labelledby="t d"><title id="t">Dépendance entre deux grandeurs</title><desc id="d">Une grandeur d’entrée est transformée par une formule pour produire une grandeur de sortie.</desc><rect width="960" height="380" rx="24" fill="#f8fafc"/><text x="44" y="50" font-family="Arial" font-size="24" font-weight="700">Une grandeur dépend d’une autre</text><g font-family="Arial" text-anchor="middle"><rect x="90" y="140" width="220" height="90" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="200" y="193" font-size="20">grandeur d’entrée</text><rect x="370" y="125" width="220" height="120" rx="18" fill="#eef2ff" stroke="#7c3aed" stroke-width="3"/><text x="480" y="182" font-size="20">formule</text><text x="480" y="215" font-size="18">ou relation</text><rect x="650" y="140" width="220" height="90" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="760" y="193" font-size="20">grandeur obtenue</text></g><path d="M310 185H370M590 185H650" stroke="#64748b" stroke-width="4"/></svg>