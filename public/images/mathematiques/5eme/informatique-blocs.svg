<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="t d"><title id="t">Programme par blocs</title><desc id="d">Une suite de blocs représente une entrée, un calcul puis une sortie.</desc><rect width="960" height="420" rx="24" fill="#f8fafc"/><text x="44" y="50" font-family="Arial" font-size="24" font-weight="700">Lire un programme bloc par bloc</text><g transform="translate(250 105)" font-family="Arial" font-size="18" fill="#334155"><rect x="0" y="0" width="460" height="65" rx="14" fill="#bfdbfe" stroke="#2563eb" stroke-width="3"/><text x="230" y="40" text-anchor="middle">lire une valeur</text><rect x="35" y="85" width="390" height="65" rx="14" fill="#ddd6fe" stroke="#7c3aed" stroke-width="3"/><text x="230" y="125" text-anchor="middle">calculer une expression</text><rect x="70" y="170" width="320" height="65" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="230" y="210" text-anchor="middle">afficher le résultat</text></g></svg>