<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="t d"><title id="t">Fractions sur une droite graduée</title><desc id="d">Droite graduée en quarts avec plusieurs fractions représentées, dont des fractions supérieures à un.</desc><rect width="960" height="360" rx="24" fill="#f8fafc"/><text x="44" y="50" font-family="Arial" font-size="24" font-weight="700" fill="#0f172a">Une fraction est un nombre</text><path d="M100 190H860" stroke="#334155" stroke-width="5"/><g stroke="#64748b" stroke-width="3"><path d="M140 170V210"/><path d="M225 170V210"/><path d="M310 170V210"/><path d="M395 170V210"/><path d="M480 170V210"/><path d="M565 170V210"/><path d="M650 170V210"/><path d="M735 170V210"/><path d="M820 170V210"/></g><g font-family="Arial" font-size="16" text-anchor="middle" fill="#334155"><text x="140" y="240">0</text><text x="225" y="240">1/4</text><text x="310" y="240">2/4</text><text x="395" y="240">3/4</text><text x="480" y="240">1</text><text x="565" y="240">5/4</text><text x="650" y="240">6/4</text><text x="735" y="240">7/4</text><text x="820" y="240">2</text></g><circle cx="395" cy="190" r="9" fill="#4f46e5"/><circle cx="650" cy="190" r="9" fill="#16a34a"/></svg>