<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="t d"><title id="t">Distributivité par aire</title><desc id="d">Un grand rectangle de hauteur k est découpé en deux rectangles de largeurs a et b, illustrant k fois a plus b égal ka plus kb.</desc><rect width="960" height="420" rx="24" fill="#f8fafc"/><text x="44" y="50" font-family="Arial" font-size="24" font-weight="700" fill="#0f172a">La distributivité comme découpage d’une aire</text><g transform="translate(170 110)" stroke="#334155" stroke-width="4"><rect x="0" y="0" width="620" height="210" fill="#fff"/><rect x="0" y="0" width="360" height="210" fill="#bfdbfe"/><rect x="360" y="0" width="260" height="210" fill="#bbf7d0"/><path d="M360 0V210"/></g><g font-family="Arial" font-size="20" text-anchor="middle" fill="#334155"><text x="350" y="225">ka</text><text x="660" y="225">kb</text><text x="480" y="365">k(a+b)=ka+kb</text></g></svg>