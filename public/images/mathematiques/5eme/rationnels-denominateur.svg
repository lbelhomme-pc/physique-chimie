<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="t d"><title id="t">Mise au même dénominateur</title><desc id="d">Deux bandes fractionnées différemment sont converties en bandes découpées avec le même nombre de parts pour permettre une addition.</desc><rect width="960" height="420" rx="24" fill="#f8fafc"/><text x="44" y="50" font-family="Arial" font-size="24" font-weight="700" fill="#0f172a">Additionner : d’abord parler la même unité de fraction</text><g transform="translate(110 120)" stroke="#64748b" stroke-width="2"><rect x="0" y="0" width="300" height="70" fill="#fff"/><rect x="0" y="0" width="200" height="70" fill="#bfdbfe"/><path d="M100 0V70M200 0V70"/><rect x="0" y="120" width="300" height="70" fill="#fff"/><rect x="0" y="120" width="150" height="70" fill="#bbf7d0"/><path d="M75 120V190M150 120V190M225 120V190"/></g><path d="M500 205H650" stroke="#4f46e5" stroke-width="5"/><path d="M635 192L660 205L635 218" fill="none" stroke="#4f46e5" stroke-width="5"/><g transform="translate(690 135)" stroke="#64748b" stroke-width="2"><rect x="0" y="0" width="180" height="140" fill="#fff"/><g stroke="#cbd5e1"><path d="M15 0V140"/><path d="M30 0V140"/><path d="M45 0V140"/><path d="M60 0V140"/><path d="M75 0V140"/><path d="M90 0V140"/><path d="M105 0V140"/><path d="M120 0V140"/><path d="M135 0V140"/><path d="M150 0V140"/><path d="M165 0V140"/></g><rect x="0" y="0" width="120" height="70" fill="#bfdbfe"/><rect x="0" y="70" width="90" height="70" fill="#bbf7d0"/></g></svg>