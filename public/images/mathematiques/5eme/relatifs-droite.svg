<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="t d"><title id="t">Droite graduée de nombres relatifs</title><desc id="d">Droite graduée avec nombres négatifs, zéro et positifs, et deux nombres opposés symétriques autour de zéro.</desc><rect width="960" height="360" rx="24" fill="#f8fafc"/><text x="44" y="50" font-family="Arial" font-size="24" font-weight="700" fill="#0f172a">Se repérer avec des nombres relatifs</text><path d="M100 190H860" stroke="#334155" stroke-width="5"/><g stroke="#64748b" stroke-width="3"><path d="M140 170V210"/><path d="M225 170V210"/><path d="M310 170V210"/><path d="M395 170V210"/><path d="M480 170V210"/><path d="M565 170V210"/><path d="M650 170V210"/><path d="M735 170V210"/><path d="M820 170V210"/></g><g font-family="Arial" font-size="17" text-anchor="middle" fill="#334155"><text x="140" y="240">−4</text><text x="225" y="240">−3</text><text x="310" y="240">−2</text><text x="395" y="240">−1</text><text x="480" y="240">0</text><text x="565" y="240">1</text><text x="650" y="240">2</text><text x="735" y="240">3</text><text x="820" y="240">4</text></g><circle cx="310" cy="190" r="10" fill="#dc2626"/><circle cx="650" cy="190" r="10" fill="#16a34a"/><text x="480" y="305" text-anchor="middle" font-family="Arial" font-size="16" fill="#64748b">−2 et 2 sont opposés : même distance à 0.</text></svg>