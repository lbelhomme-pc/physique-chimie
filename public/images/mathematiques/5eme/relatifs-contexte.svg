<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="t d"><title id="t">Nombres relatifs dans des contextes</title><desc id="d">Thermomètre, altitude et chronologie illustrent des valeurs positives et négatives autour d’une référence zéro.</desc><rect width="960" height="420" rx="24" fill="#f8fafc"/><text x="44" y="50" font-family="Arial" font-size="24" font-weight="700" fill="#0f172a">Un zéro de référence, des valeurs de part et d’autre</text><g font-family="Arial" text-anchor="middle"><rect x="80" y="100" width="220" height="240" rx="18" fill="#eff6ff" stroke="#60a5fa" stroke-width="3"/><text x="190" y="145" font-size="18" font-weight="700">Température</text><text x="190" y="205" font-size="30" fill="#2563eb">−5</text><text x="190" y="255" font-size="16" fill="#64748b">sous 0</text><rect x="370" y="100" width="220" height="240" rx="18" fill="#f0fdf4" stroke="#4ade80" stroke-width="3"/><text x="480" y="145" font-size="18" font-weight="700">Altitude</text><text x="480" y="205" font-size="30" fill="#16a34a">+850</text><text x="480" y="255" font-size="16" fill="#64748b">au-dessus du niveau 0</text><rect x="660" y="100" width="220" height="240" rx="18" fill="#fff7ed" stroke="#fb923c" stroke-width="3"/><text x="770" y="145" font-size="18" font-weight="700">Écart</text><text x="770" y="205" font-size="30" fill="#ea580c">−12</text><text x="770" y="255" font-size="16" fill="#64748b">variation négative</text></g></svg>