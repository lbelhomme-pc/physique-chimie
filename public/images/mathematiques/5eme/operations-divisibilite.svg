<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="t d"><title id="t">Multiples, diviseurs et critères</title><desc id="d">Un nombre au centre est relié à plusieurs critères de divisibilité par 2, 3, 5, 9 et 10.</desc><rect width="960" height="420" rx="24" fill="#f8fafc"/><text x="44" y="50" font-family="Arial" font-size="24" font-weight="700" fill="#0f172a">Tester rapidement la divisibilité</text><circle cx="480" cy="225" r="70" fill="#eef2ff" stroke="#6366f1" stroke-width="4"/><text x="480" y="235" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#312e81">nombre entier</text><g font-family="Arial" font-size="17" text-anchor="middle" fill="#334155"><text x="160" y="130">par 2 : chiffre pair</text><text x="800" y="130">par 5 : 0 ou 5</text><text x="150" y="320">par 3 : somme des chiffres</text><text x="810" y="320">par 9 : somme des chiffres</text><text x="480" y="385">par 10 : chiffre 0</text></g><g stroke="#94a3b8" stroke-width="3"><path d="M420 180L220 140"/><path d="M540 180L740 140"/><path d="M420 270L220 305"/><path d="M540 270L740 305"/><path d="M480 295V350"/></g></svg>