<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="t d"><title id="t">Boucle inconditionnelle</title><desc id="d">Un bloc répéter cinq fois contient deux instructions et illustre une boucle à nombre de répétitions fixé.</desc><rect width="960" height="420" rx="24" fill="#f8fafc"/><text x="44" y="50" font-family="Arial" font-size="24" font-weight="700">Répéter un nombre fixé de fois</text><rect x="250" y="105" width="460" height="230" rx="24" fill="#fff7ed" stroke="#f97316" stroke-width="4"/><text x="480" y="145" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#9a3412">répéter 5 fois</text><rect x="315" y="175" width="330" height="55" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><rect x="315" y="250" width="330" height="55" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/></svg>