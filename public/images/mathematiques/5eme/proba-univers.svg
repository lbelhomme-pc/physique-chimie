<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" aria-labelledby="t d"><title id="t">Issues d’un dé et événement pair</title><desc id="d">Six cases représentent les issues d’un dé et trois cases colorées identifient l’événement obtenir un nombre pair.</desc><rect width="960" height="380" rx="24" fill="#f8fafc"/><text x="44" y="50" font-family="Arial" font-size="24" font-weight="700">Issues et événement</text><g transform="translate(120 130)" font-family="Arial" font-size="26" text-anchor="middle"><rect x="0" y="0" width="90" height="90" rx="14" fill="#fff" stroke="#94a3b8" stroke-width="3"/><text x="45" y="55" fill="#334155">1</text><rect x="120" y="0" width="90" height="90" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="165" y="55" fill="#334155">2</text><rect x="240" y="0" width="90" height="90" rx="14" fill="#fff" stroke="#94a3b8" stroke-width="3"/><text x="285" y="55" fill="#334155">3</text><rect x="360" y="0" width="90" height="90" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="405" y="55" fill="#334155">4</text><rect x="480" y="0" width="90" height="90" rx="14" fill="#fff" stroke="#94a3b8" stroke-width="3"/><text x="525" y="55" fill="#334155">5</text><rect x="600" y="0" width="90" height="90" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="645" y="55" fill="#334155">6</text></g><text x="480" y="300" text-anchor="middle" font-family="Arial" font-size="17" fill="#64748b">Événement « obtenir un nombre pair » : 3 issues favorables sur 6.</text></svg>