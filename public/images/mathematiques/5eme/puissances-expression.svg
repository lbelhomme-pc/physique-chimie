<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="t d"><title id="t">Lecture d’une puissance dans une expression</title><desc id="d">Schéma décomposant une expression numérique avec carré, produit et addition selon les priorités.</desc><rect width="960" height="420" rx="24" fill="#f8fafc"/><text x="44" y="50" font-family="Arial" font-size="24" font-weight="700" fill="#0f172a">Lire puis calculer une expression avec une puissance</text><g font-family="Arial" text-anchor="middle"><rect x="210" y="105" width="540" height="80" rx="16" fill="#eef2ff" stroke="#6366f1" stroke-width="3"/><text x="480" y="155" font-size="28" font-weight="700" fill="#312e81">3² + 4 × 5</text><path d="M380 185L300 260M480 185V260M580 185L660 260" stroke="#94a3b8" stroke-width="3"/><text x="300" y="300" font-size="18" fill="#334155">puissance</text><text x="480" y="300" font-size="18" fill="#334155">produit</text><text x="660" y="300" font-size="18" fill="#334155">somme finale</text></g></svg>