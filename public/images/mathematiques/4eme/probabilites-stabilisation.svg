<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="t d"><title id="t">Stabilisation des fréquences</title><desc id="d">Une courbe de fréquence fluctue fortement au début puis se rapproche d’une ligne horizontale correspondant à la probabilité théorique.</desc><rect width="960" height="420" rx="24" fill="#f8fafc"/><text x="44" y="50" font-family="Arial,sans-serif" font-size="24" font-weight="700">Plus on répète, plus la fréquence tend à se stabiliser</text><g transform="translate(100 90)"><path d="M40 270V20M40 270H740" stroke="#64748b" stroke-width="3"/><path d="M40 145H740" stroke="#16a34a" stroke-width="3" stroke-dasharray="9 8"/><polyline points="50,50 90,225 130,95 180,190 230,120 290,165 350,132 420,153 500,138 590,148 680,143 735,146" fill="none" stroke="#4f46e5" stroke-width="5"/><text x="610" y="128" font-family="Arial,sans-serif" font-size="15" fill="#15803d">probabilité du modèle</text></g></svg>