<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="t d"><title id="t">Quatrième proportionnelle</title><desc id="d">Tableau de proportionnalité avec une valeur manquante et flèches montrant le coefficient entre deux lignes.</desc><rect width="960" height="420" rx="24" fill="#f8fafc"/><text x="44" y="50" font-family="Arial,sans-serif" font-size="24" font-weight="700">Trouver une quatrième proportionnelle</text><g transform="translate(170 125)" font-family="Arial,sans-serif" text-anchor="middle"><rect width="620" height="160" rx="14" fill="#fff" stroke="#94a3b8" stroke-width="3"/><path d="M0 80H620M205 0V160M410 0V160" stroke="#cbd5e1" stroke-width="2"/><text x="102" y="50" font-size="19">3</text><text x="307" y="50" font-size="19">5</text><text x="512" y="50" font-size="19">8</text><text x="102" y="130" font-size="19">12</text><text x="307" y="130" font-size="19">20</text><text x="512" y="130" font-size="23" font-weight="700" fill="#7c3aed">?</text></g><text x="480" y="345" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#475569">Même coefficient : ici ×4, donc 8 ↦ 32.</text></svg>