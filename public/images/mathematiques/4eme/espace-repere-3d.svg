<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="t d"><title id="t">Repérage dans un pavé droit</title><desc id="d">Un pavé droit en perspective montre trois directions correspondant à abscisse, ordonnée et altitude.</desc><rect width="960" height="420" rx="24" fill="#f8fafc"/><text x="44" y="50" font-family="Arial,sans-serif" font-size="24" font-weight="700">Se repérer dans l’espace</text><g transform="translate(250 100)" stroke="#334155" stroke-width="4" fill="#fff"><path d="M0 90L180 20L410 90L230 160Z"/><path d="M0 90V260L230 330V160Z"/><path d="M410 90V260L230 330V160Z"/></g><circle cx="480" cy="260" r="10" fill="#7c3aed"/><text x="495" y="250" font-family="Arial,sans-serif" font-size="18">P</text><path d="M250 360H450M250 360L170 300M250 360V175" stroke-width="5"/><path d="M250 360H450" stroke="#2563eb"/><path d="M250 360L170 300" stroke="#16a34a"/><path d="M250 360V175" stroke="#dc2626"/><g font-family="Arial,sans-serif" font-size="16"><text x="455" y="365" fill="#2563eb">abscisse</text><text x="90" y="300" fill="#16a34a">ordonnée</text><text x="260" y="180" fill="#dc2626">altitude</text></g></svg>