<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="t d"><title id="t">Variable informatique</title><desc id="d">Une boîte nommée score contient une valeur qui est lue puis modifiée par une instruction.</desc><rect width="960" height="420" rx="24" fill="#f8fafc"/><text x="44" y="50" font-family="Arial,sans-serif" font-size="24" font-weight="700">Une variable mémorise une valeur qui peut changer</text><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="120" y="135" width="230" height="130" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="235" y="180" font-size="19">variable score</text><text x="235" y="230" font-size="34" font-weight="700">7</text><path d="M390 200H540" stroke="#64748b" stroke-width="5"/><path d="M525 187L550 200L525 213" fill="none" stroke="#64748b" stroke-width="5"/><rect x="590" y="135" width="250" height="130" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="715" y="180" font-size="18">ajouter 3</text><text x="715" y="230" font-size="34" font-weight="700">10</text></g></svg>