<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="t d"><title id="t">Effets d’un agrandissement</title><desc id="d">Un carré et un cube illustrent les facteurs k sur les longueurs, k carré sur les aires et k cube sur les volumes.</desc><rect width="960" height="420" rx="24" fill="#f8fafc"/><text x="44" y="50" font-family="Arial,sans-serif" font-size="24" font-weight="700">Agrandir : longueurs ×k, aires ×k², volumes ×k³</text><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="90" y="130" width="210" height="170" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="195" y="205" font-size="24" font-weight="700">longueurs</text><text x="195" y="250" font-size="28" fill="#1e3a8a">× k</text><rect x="375" y="130" width="210" height="170" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="480" y="205" font-size="24" font-weight="700">aires</text><text x="480" y="250" font-size="28" fill="#166534">× k²</text><rect x="660" y="130" width="210" height="170" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/><text x="765" y="205" font-size="24" font-weight="700">volumes</text><text x="765" y="250" font-size="28" fill="#991b1b">× k³</text></g></svg>