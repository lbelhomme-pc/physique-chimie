<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="t d"><title id="t">Diviser par une fraction</title><desc id="d">Deux étapes montrent qu’une division par une fraction devient une multiplication par son inverse.</desc><rect width="960" height="420" rx="24" fill="#f8fafc"/><text x="44" y="50" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#0f172a">Diviser par une fraction</text><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="90" y="130" width="300" height="120" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="240" y="182" font-size="23" fill="#1e3a8a">a/b ÷ c/d</text><text x="240" y="220" font-size="16" fill="#64748b">c/d non nul</text><path d="M420 190H540" stroke="#64748b" stroke-width="5"/><path d="M525 177L550 190L525 203" fill="none" stroke="#64748b" stroke-width="5"/><rect x="575" y="130" width="300" height="120" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="725" y="182" font-size="23" fill="#166534">a/b × d/c</text><text x="725" y="220" font-size="16" fill="#64748b">on multiplie par l’inverse</text></g></svg>