<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="t d"><title id="t">Événement et événement contraire</title><desc id="d">Un rectangle représentant toutes les issues est partagé entre un événement A et son événement contraire.</desc><rect width="960" height="420" rx="24" fill="#f8fafc"/><text x="44" y="50" font-family="Arial,sans-serif" font-size="24" font-weight="700">Un événement et son contraire couvrent tous les cas</text><rect x="120" y="115" width="720" height="220" rx="22" fill="#fff" stroke="#64748b" stroke-width="4"/><path d="M520 115V335" stroke="#64748b" stroke-width="3"/><rect x="120" y="115" width="400" height="220" rx="22" fill="#dbeafe" opacity=".9"/><text x="320" y="230" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#1e3a8a">A</text><text x="680" y="230" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#475569">contraire de A</text><text x="480" y="380" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#334155">P(A) + P(contraire de A) = 1</text></svg>