<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="t d"><title id="t">Lire une valeur sur un graphique</title><desc id="d">Un repère montre une courbe et des pointillés de projection pour lire la valeur y correspondant à une valeur x.</desc><rect width="960" height="420" rx="24" fill="#f8fafc"/><text x="44" y="50" font-family="Arial,sans-serif" font-size="24" font-weight="700">Lire une dépendance sur un graphique</text><g transform="translate(170 85)"><path d="M50 270V20M50 270H620" stroke="#64748b" stroke-width="3"/><path d="M50 245C160 205 230 80 360 105S520 200 600 65" fill="none" stroke="#4f46e5" stroke-width="5"/><path d="M300 270V112M50 112H300" stroke="#dc2626" stroke-width="3" stroke-dasharray="8 7"/><circle cx="300" cy="112" r="9" fill="#dc2626"/><text x="300" y="300" text-anchor="middle" font-family="Arial,sans-serif" font-size="17">x donné</text><text x="25" y="118" text-anchor="end" font-family="Arial,sans-serif" font-size="17">valeur lue</text></g></svg>