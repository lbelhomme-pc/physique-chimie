<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="t d"><title id="t">Développer et factoriser</title><desc id="d">Un rectangle découpé illustre k(a+b)=ka+kb et le passage dans les deux sens.</desc><rect width="960" height="420" rx="24" fill="#f8fafc"/><text x="44" y="50" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#0f172a">Développer et factoriser</text><g transform="translate(170 115)" stroke="#334155" stroke-width="4"><rect width="620" height="190" fill="#fff"/><rect width="370" height="190" fill="#bfdbfe"/><rect x="370" width="250" height="190" fill="#bbf7d0"/><path d="M370 0V190"/></g><g font-family="Arial,sans-serif" text-anchor="middle" fill="#334155"><text x="355" y="220" font-size="22">ka</text><text x="665" y="220" font-size="22">kb</text><text x="480" y="360" font-size="21" font-weight="700">k(a+b) = ka + kb</text></g></svg>