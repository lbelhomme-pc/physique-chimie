<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="t d"><title id="t">Proportionnalité dans un repère</title><desc id="d">Des points alignés avec l’origine représentent une relation de proportionnalité, comparés à une relation non proportionnelle.</desc><rect width="960" height="420" rx="24" fill="#f8fafc"/><text x="44" y="50" font-family="Arial,sans-serif" font-size="24" font-weight="700">Graphiquement : alignement avec l’origine</text><g transform="translate(90 100)"><path d="M40 250V20M40 250H330" stroke="#64748b" stroke-width="3"/><path d="M40 250L300 55" stroke="#16a34a" stroke-width="4"/><g fill="#16a34a"><circle cx="95" cy="210" r="8"/><circle cx="150" cy="170" r="8"/><circle cx="210" cy="125" r="8"/><circle cx="270" cy="80" r="8"/></g><text x="180" y="290" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#166534">proportionnel</text></g><g transform="translate(540 100)"><path d="M40 250V20M40 250H330" stroke="#64748b" stroke-width="3"/><path d="M40 215L300 50" stroke="#dc2626" stroke-width="4"/><g fill="#dc2626"><circle cx="95" cy="180" r="8"/><circle cx="150" cy="145" r="8"/><circle cx="210" cy="106" r="8"/><circle cx="270" cy="68" r="8"/></g><text x="180" y="290" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#991b1b">ne passe pas par O</text></g></svg>