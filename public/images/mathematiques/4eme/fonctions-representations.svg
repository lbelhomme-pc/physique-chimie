<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="t d"><title id="t">Trois représentations d’une dépendance</title><desc id="d">Une formule, un tableau de valeurs et un graphique sont reliés par des flèches.</desc><rect width="960" height="420" rx="24" fill="#f8fafc"/><text x="44" y="50" font-family="Arial,sans-serif" font-size="24" font-weight="700">Contexte, formule, tableau, graphique</text><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="70" y="145" width="220" height="110" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="180" y="195" font-size="21" font-weight="700">formule</text><text x="180" y="225" font-size="18">y = 2x + 3</text><rect x="370" y="130" width="220" height="140" rx="18" fill="#eef2ff" stroke="#7c3aed" stroke-width="3"/><text x="480" y="178" font-size="21" font-weight="700">tableau</text><text x="480" y="218" font-size="17">x : 0  1  2</text><text x="480" y="245" font-size="17">y : 3  5  7</text><rect x="670" y="145" width="220" height="110" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="780" y="205" font-size="21" font-weight="700">graphique</text></g><path d="M290 200H370M590 200H670" stroke="#64748b" stroke-width="4"/></svg>