<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="t d"><title id="t">Encadrer une racine carrée</title><desc id="d">Droite numérique montrant racine de 20 entre 4 et 5.</desc><rect width="960" height="420" rx="24" fill="#f8fafc"/><text x="44" y="50" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#0f172a">Encadrer une racine carrée</text><path d="M150 210H820" stroke="#334155" stroke-width="5"/><path d="M300 185V235M650 185V235" stroke="#64748b" stroke-width="3"/><text x="300" y="275" text-anchor="middle" font-family="Arial,sans-serif" font-size="20">4</text><text x="650" y="275" text-anchor="middle" font-family="Arial,sans-serif" font-size="20">5</text><circle cx="456" cy="210" r="11" fill="#7c3aed"/><text x="456" y="165" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#6d28d9">√20 ≈ 4,47</text><text x="480" y="330" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#64748b">16 &lt; 20 &lt; 25 donc 4 &lt; √20 &lt; 5</text></svg>