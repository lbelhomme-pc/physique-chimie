<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="t d"><title id="t">Instruction conditionnelle</title><desc id="d">Organigramme simple : une condition mène à une action si elle est vraie et à une autre branche sinon.</desc><rect width="960" height="420" rx="24" fill="#f8fafc"/><text x="44" y="50" font-family="Arial,sans-serif" font-size="24" font-weight="700">Si une condition est vraie, exécuter une action</text><path d="M480 105L620 190L480 275L340 190Z" fill="#eef2ff" stroke="#7c3aed" stroke-width="4"/><text x="480" y="197" text-anchor="middle" font-family="Arial,sans-serif" font-size="20">condition ?</text><path d="M340 190H190V315M620 190H770V315" stroke="#64748b" stroke-width="4" fill="none"/><rect x="100" y="315" width="180" height="65" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><rect x="680" y="315" width="180" height="65" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/><text x="190" y="355" text-anchor="middle" font-family="Arial,sans-serif" font-size="18">action</text><text x="770" y="355" text-anchor="middle" font-family="Arial,sans-serif" font-size="18">suite</text><text x="285" y="175" font-family="Arial,sans-serif" font-size="16" fill="#16a34a">oui</text><text x="655" y="175" font-family="Arial,sans-serif" font-size="16" fill="#dc2626">non</text></svg>