<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="t d"><title id="t">Notation scientifique</title><desc id="d">Un nombre est écrit sous la forme a fois dix puissance n avec a compris entre 1 inclus et 10 exclu.</desc><rect width="960" height="420" rx="24" fill="#f8fafc"/><text x="44" y="50" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#0f172a">Notation scientifique</text><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="140" y="120" width="680" height="150" rx="22" fill="#eef2ff" stroke="#6366f1" stroke-width="4"/><text x="480" y="185" font-size="34" font-weight="700" fill="#312e81">a × 10ⁿ</text><text x="480" y="230" font-size="20" fill="#475569">1 ≤ |a| &lt; 10</text></g><text x="480" y="330" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#64748b">45 700 000 = 4,57 × 10⁷</text></svg>