<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="t d"><title id="t">Moyenne et médiane face à une valeur extrême</title><desc id="d">Deux séries illustrent que la moyenne peut être déplacée par une valeur extrême tandis que la médiane reste plus stable.</desc><rect width="960" height="420" rx="24" fill="#f8fafc"/><text x="44" y="50" font-family="Arial,sans-serif" font-size="24" font-weight="700">Moyenne et médiane ne racontent pas la même chose</text><g transform="translate(100 110)" font-family="Arial,sans-serif"><text x="160" y="0" text-anchor="middle" font-size="18" font-weight="700">Série A</text><path d="M20 105H310" stroke="#64748b" stroke-width="4"/><g fill="#4f46e5"><circle cx="70" cy="105" r="9"/><circle cx="105" cy="105" r="9"/><circle cx="140" cy="105" r="9"/><circle cx="175" cy="105" r="9"/><circle cx="210" cy="105" r="9"/></g><text x="160" y="155" text-anchor="middle" fill="#64748b">valeurs regroupées</text></g><g transform="translate(520 110)" font-family="Arial,sans-serif"><text x="160" y="0" text-anchor="middle" font-size="18" font-weight="700">Série B</text><path d="M20 105H310" stroke="#64748b" stroke-width="4"/><g fill="#16a34a"><circle cx="70" cy="105" r="9"/><circle cx="105" cy="105" r="9"/><circle cx="140" cy="105" r="9"/><circle cx="175" cy="105" r="9"/><circle cx="290" cy="105" r="9"/></g><text x="160" y="155" text-anchor="middle" fill="#64748b">une valeur extrême</text></g><text x="480" y="340" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#475569">La moyenne utilise toutes les valeurs ; la médiane dépend surtout de leur ordre.</text></svg>