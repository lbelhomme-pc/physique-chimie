name: C03 dependency audit remediation

on:
  push:
    branches:
      - audit-2026-c01-route-snapshot

permissions:
  contents: write

jobs:
  remediate-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Audit before remediation
        shell: bash
        run: |
          npm audit --json > audit-before.json || true
          node - <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('audit-before.json', 'utf8'));
          console.log('AUDIT_BEFORE', JSON.stringify(report.metadata?.vulnerabilities ?? {}));
          for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
            console.log(`VULN_BEFORE ${name} severity=${item.severity} direct=${item.isDirect} range=${item.range} fix=${JSON.stringify(item.fixAvailable)}`);
          }
          NODE

      - name: Apply non-breaking npm audit lockfile fixes
        run: npm audit fix --package-lock-only --ignore-scripts || true

      - name: Audit after remediation
        shell: bash
        run: |
          npm audit --json > audit-after.json || true
          node - <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('audit-after.json', 'utf8'));
          console.log('AUDIT_AFTER', JSON.stringify(report.metadata?.vulnerabilities ?? {}));
          for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
            console.log(`VULN_AFTER ${name} severity=${item.severity} direct=${item.isDirect} range=${item.range} fix=${JSON.stringify(item.fixAvailable)}`);
          }
          NODE

      - name: Commit lockfile remediation when changed
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'No package-lock.json change produced by npm audit fix.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'C03: apply non-breaking dependency lockfile fixes'
          git push
