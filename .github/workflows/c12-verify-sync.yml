name: C12 verifier migration

on:
  push:
    branches:
      - audit-2026-c01-route-snapshot
    paths:
      - .github/workflows/c12-verify-sync.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-2026-c01-route-snapshot
          fetch-depth: 0
      - name: Apply verifier migration
        run: python scripts/c12-migrate-verifier.py
      - name: Validate verifier
        run: |
          git diff --check
          node --check scripts/verify-routes-and-content.mjs
      - name: Commit verifier migration
        run: |
          git rm .github/workflows/c12-verify-sync.yml scripts/c12-migrate-verifier.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "C12: align authoritative verifier with active redirects"
          git push origin HEAD:audit-2026-c01-route-snapshot
