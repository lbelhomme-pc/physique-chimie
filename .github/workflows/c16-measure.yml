name: C16 measure hydration budgets

on:
  push:
    branches:
      - audit-2026-c01-route-snapshot
    paths:
      - .github/workflows/c16-measure.yml

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-2026-c01-route-snapshot
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install current dependencies
        run: npm ci

      - name: Build current C16
        run: npm run build

      - name: Measure current routes
        run: |
          python - <<'PY' > /tmp/c16-current.json
          from html.parser import HTMLParser
          from pathlib import Path
          import json, os

          routes = [
            "/",
            "/mathematiques",
            "/physique-chimie",
            "/physique-chimie/college/4eme/chimie/atomes-molecules",
            "/outils-methodes/python-lab",
            "/memorisation/mega-quiz",
          ]

          class Assets(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.scripts = []
                  self.styles = []
                  self.islands = 0
              def handle_starttag(self, tag, attrs):
                  data = dict(attrs)
                  if tag == "script" and data.get("src"):
                      self.scripts.append(data["src"])
                  if tag == "link" and "stylesheet" in data.get("rel", "").split() and data.get("href"):
                      self.styles.append(data["href"])
                  if tag == "astro-island":
                      self.islands += 1

          def local_file(url):
              clean = url.split("?", 1)[0].split("#", 1)[0]
              if clean.startswith("http://") or clean.startswith("https://") or clean.startswith("//"):
                  return None
              return Path("dist") / clean.lstrip("/")

          def sum_unique(urls):
              total = 0
              seen = set()
              for url in urls:
                  f = local_file(url)
                  if not f or f in seen or not f.exists():
                      continue
                  seen.add(f)
                  total += f.stat().st_size
              return total

          result = {}
          for route in routes:
              html_file = Path("dist/index.html") if route == "/" else Path("dist") / route.strip("/") / "index.html"
              html = html_file.read_text(encoding="utf-8")
              parser = Assets(); parser.feed(html)
              html_bytes = html_file.stat().st_size
              js_bytes = sum_unique(parser.scripts)
              css_bytes = sum_unique(parser.styles)
              result[route] = {
                  "htmlBytes": html_bytes,
                  "jsBytes": js_bytes,
                  "cssBytes": css_bytes,
                  "totalBytes": html_bytes + js_bytes + css_bytes,
                  "astroIslands": parser.islands,
                  "scriptCount": len(parser.scripts),
              }
          print(json.dumps(result, ensure_ascii=False, indent=2))
          PY

      - name: Build C15 baseline
        run: |
          git worktree add /tmp/c16-base 393e5314e23362ee58bb1a05319f74fadaa9f4d6
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/c16-base/node_modules
          cd /tmp/c16-base
          npm run build

      - name: Measure C15 baseline routes
        run: |
          cd /tmp/c16-base
          python - <<'PY' > /tmp/c16-base.json
          from html.parser import HTMLParser
          from pathlib import Path
          import json

          routes = [
            "/",
            "/mathematiques",
            "/physique-chimie",
            "/physique-chimie/college/4eme/chimie/atomes-molecules",
            "/outils-methodes/python-lab",
            "/memorisation/mega-quiz",
          ]

          class Assets(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.scripts = []
                  self.styles = []
                  self.islands = 0
              def handle_starttag(self, tag, attrs):
                  data = dict(attrs)
                  if tag == "script" and data.get("src"):
                      self.scripts.append(data["src"])
                  if tag == "link" and "stylesheet" in data.get("rel", "").split() and data.get("href"):
                      self.styles.append(data["href"])
                  if tag == "astro-island":
                      self.islands += 1

          def local_file(url):
              clean = url.split("?", 1)[0].split("#", 1)[0]
              if clean.startswith("http://") or clean.startswith("https://") or clean.startswith("//"):
                  return None
              return Path("dist") / clean.lstrip("/")

          def sum_unique(urls):
              total = 0
              seen = set()
              for url in urls:
                  f = local_file(url)
                  if not f or f in seen or not f.exists():
                      continue
                  seen.add(f)
                  total += f.stat().st_size
              return total

          result = {}
          for route in routes:
              html_file = Path("dist/index.html") if route == "/" else Path("dist") / route.strip("/") / "index.html"
              html = html_file.read_text(encoding="utf-8")
              parser = Assets(); parser.feed(html)
              html_bytes = html_file.stat().st_size
              js_bytes = sum_unique(parser.scripts)
              css_bytes = sum_unique(parser.styles)
              result[route] = {
                  "htmlBytes": html_bytes,
                  "jsBytes": js_bytes,
                  "cssBytes": css_bytes,
                  "totalBytes": html_bytes + js_bytes + css_bytes,
                  "astroIslands": parser.islands,
                  "scriptCount": len(parser.scripts),
              }
          print(json.dumps(result, ensure_ascii=False, indent=2))
          PY

      - name: Report before and after
        run: |
          python - <<'PY'
          import json
          base = json.load(open('/tmp/c16-base.json', encoding='utf-8'))
          current = json.load(open('/tmp/c16-current.json', encoding='utf-8'))
          print('C16_BEFORE_AFTER_JSON_BEGIN')
          print(json.dumps({'baseC15': base, 'currentC16': current}, ensure_ascii=False, indent=2))
          print('C16_BEFORE_AFTER_JSON_END')
          print('\nC16 route deltas:')
          for route in current:
              b = base[route]; c = current[route]
              js_delta = c['jsBytes'] - b['jsBytes']
              total_delta = c['totalBytes'] - b['totalBytes']
              island_delta = c['astroIslands'] - b['astroIslands']
              print(f"{route}: JS {b['jsBytes']} -> {c['jsBytes']} ({js_delta:+}); total {b['totalBytes']} -> {c['totalBytes']} ({total_delta:+}); islands {b['astroIslands']} -> {c['astroIslands']} ({island_delta:+})")
          PY
