name: C15 security unblock

on:
  push:
    branches:
      - audit-2026-c01-route-snapshot
    paths:
      - .github/workflows/c15-security-unblock.yml

permissions:
  contents: write

jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-2026-c01-route-snapshot
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Apply npm audit lockfile fix
        run: npm audit fix --package-lock-only
      - name: Keep package manifest unchanged
        run: git diff --exit-code -- package.json
      - name: Reinstall from repaired lockfile
        run: npm ci
      - name: Enforce high severity security gate
        run: npm audit --audit-level=high
      - name: Validate tests after lockfile repair
        run: npm test
      - name: Commit repaired lockfile and remove temporary workflow
        run: |
          git rm .github/workflows/c15-security-unblock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "C15: refresh lockfile for browserslist security fix"
          git push origin HEAD:audit-2026-c01-route-snapshot
