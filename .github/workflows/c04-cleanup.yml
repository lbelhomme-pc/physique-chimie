name: C04 targeted lint cleanup

on:
  push:
    branches: ["audit-2026-c01-route-snapshot"]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: audit-2026-c01-route-snapshot

      - name: Apply targeted C04 fixes
        shell: python
        run: |
          from pathlib import Path
          import re

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              actual = text.count(old)
              if actual < count:
                  raise SystemExit(f"{path}: expected at least {count} occurrence(s), found {actual}: {old[:80]!r}")
              text = text.replace(old, new, count)
              p.write_text(text, encoding="utf-8")

          # React hooks: make dependencies explicit and stable.
          p = Path("src/components/pedagogie/CoursTracker.tsx")
          text = p.read_text(encoding="utf-8")
          text = text.replace(
              'import { useEffect, useRef, useState } from "react";',
              'import { useCallback, useEffect, useRef, useState } from "react";',
              1,
          )
          text = text.replace(
              '''  function addToast(toast: Omit<ToastItem, "id">) {\n    const id = `toast-${Date.now()}-${Math.random()}`;\n    setToasts((prev) => [...prev, { ...toast, id }]);\n  }''',
              '''  const addToast = useCallback((toast: Omit<ToastItem, "id">) => {\n    const id = `toast-${Date.now()}-${Math.random()}`;\n    setToasts((prev) => [...prev, { ...toast, id }]);\n  }, []);''',
              1,
          )
          reward_old = '''  function rewardCoursRead() {\n    try {\n      const engine = getGamificationEngine();\n      const result = engine.completeCours(chapterId, xpConfig);\n\n      if (result.xp > 0) {\n        addToast({ type: "xp", message: `Cours lu ! +${result.xp} XP 📖`, icon: "📖" });\n      }\n      if (result.rankUp) {\n        addToast({ type: "rank_up", message: `Nouveau rang : ${result.rankUp.icon} ${result.rankUp.name} !`, icon: result.rankUp.icon });\n      }\n      for (const badge of result.newBadges) {\n        addToast({ type: "badge", message: `Badge : ${badge.icon} ${badge.name}`, icon: badge.icon });\n      }\n    } catch (e) {\n      console.warn("CoursTracker: gamification not available", e);\n    }\n  }\n\n'''
          if reward_old not in text:
              raise SystemExit("CoursTracker: rewardCoursRead block not found")
          text = text.replace(reward_old, "", 1)
          reward_new = reward_old.replace("  function rewardCoursRead() {", "  const rewardCoursRead = useCallback(() => {").replace("\n  }\n\n", "\n  }, [addToast, chapterId, xpConfig]);\n\n", 1)
          marker = "  // Scroll tracking\n"
          if marker not in text:
              raise SystemExit("CoursTracker: scroll marker not found")
          text = text.replace(marker, reward_new + marker, 1)
          text = text.replace("  }, [chapterId, hasTracked]);", "  }, [hasTracked, rewardCoursRead]);", 1)
          p.write_text(text, encoding="utf-8")

          replace(
              "src/components/pedagogie/FlashcardsPlayer.tsx",
              "[chapterId, allCards]);",
              "[chapterId, allCards, srs]);",
          )

          # Dead imports / dead state.
          replace(
              "src/components/pedagogie/BadgesPage.tsx",
              'import { BADGES, type BadgeDef } from "../../data/gamification/config";',
              'import { BADGES } from "../../data/gamification/config";',
          )
          replace(
              "src/components/pedagogie/StatsPage.tsx",
              'import { useState, useEffect, useMemo } from "react";',
              'import { useState, useEffect } from "react";',
          )
          replace(
              "src/components/pedagogie/StatsPage.tsx",
              'import { RANKS } from "../../data/gamification/config";\n',
              '',
          )
          replace(
              "src/components/pedagogie/StatsPage.tsx",
              '  // Rangs traversés\n  const ranksAchieved = RANKS.filter(r => xp >= r.xpRequired);\n\n',
              '',
          )

          p = Path("src/components/pedagogie/QuizBlock.astro")
          text = p.read_text(encoding="utf-8")
          for old in [
              "    let currentAttemptStarted = false;\n\n",
              "          currentAttemptStarted = true;\n\n",
              "      currentAttemptStarted = false;\n",
          ]:
              if old not in text:
                  raise SystemExit(f"QuizBlock: missing expected fragment {old!r}")
              text = text.replace(old, "", 1)
          p.write_text(text, encoding="utf-8")

          replace("src/data/gamification/engine.ts", "  STREAK_FREEZE_COST,\n", "")
          replace("src/data/gamification/srs.ts", "    let state = this.cards.get(k) ?? this.createNewCard(canonicalChapterId, cardId);", "    const state = this.cards.get(k) ?? this.createNewCard(canonicalChapterId, cardId);")
          replace(
              "src/data/gamification/useGamification.ts",
              'import { RANKS, type Rank, type SubLevel, getSubLevel } from "./config";',
              'import { type Rank, type SubLevel } from "./config";',
          )

          # Laboratory scripts: remove values that are no longer consumed.
          replace(
              "src/scripts/laboratoire/circuit-rc.js",
              'import { createLabRuntime, fitCanvas, frNumber, getThemeColor, onLabReady, prefersReducedMotion } from "./lab-utils.js";',
              'import { createLabRuntime, fitCanvas, frNumber, getThemeColor, onLabReady } from "./lab-utils.js";',
          )
          replace("src/scripts/laboratoire/circuit-rc.js", "  const reducedMotion = prefersReducedMotion();\n", "")
          replace("src/scripts/laboratoire/circuit-rc.js", '    const danger = getThemeColor("--accent-danger", "#ef4444");\n', "")

          replace(
              "src/scripts/laboratoire/gaz-parfaits.js",
              'import { createLabRuntime, fitCanvas, frNumber, onLabReady, prefersReducedMotion } from "./lab-utils.js";',
              'import { createLabRuntime, fitCanvas, frNumber, onLabReady } from "./lab-utils.js";',
          )
          replace("src/scripts/laboratoire/gaz-parfaits.js", "  const reducedMotion = prefersReducedMotion();\n", "")

          replace(
              "src/scripts/laboratoire/lois-kepler.js",
              'import { createLabRuntime, fitCanvas, frNumber, onLabReady, prefersReducedMotion } from "./lab-utils.js";',
              'import { createLabRuntime, fitCanvas, frNumber, onLabReady } from "./lab-utils.js";',
          )
          replace("src/scripts/laboratoire/lois-kepler.js", "  const reducedMotion = prefersReducedMotion();\n", "")
          replace("src/scripts/laboratoire/lois-kepler.js", "  const clamp = (value, min, max) => Math.max(min, Math.min(max, value));\n\n", "")

          # Large generic renderer: tighten signatures, remove unused locals, and delete superseded legacy renderer.
          p = Path("src/scripts/laboratoire/generic-lab-simulator.js")
          text = p.read_text(encoding="utf-8")
          replacements = [
              ("    drawSolarScale(ctx, w, h, c);", "    drawSolarScale(ctx, w);"),
              ("    drawSelectedPlanetCard(ctx, w, h, selected, c);", "    drawSelectedPlanetCard(ctx, w, selected);"),
              ("  function drawSolarScale(ctx, w, h) {", "  function drawSolarScale(ctx, w) {"),
              ("  function drawSelectedPlanetCard(ctx, w, h, planet) {", "  function drawSelectedPlanetCard(ctx, w, planet) {"),
              ("      const waterHeight = inner.height - oilHeight;\n", ""),
              ("        const gridH = rows * cell;\n", ""),
              ("    for (let mark of [0, 7, 14]) {", "    for (const mark of [0, 7, 14]) {"),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"generic-lab-simulator: missing {old!r}")
              text = text.replace(old, new, 1)
          pattern = re.compile(r'\n  function drawWeightLegacy\(ctx, w, h, p\) \{.*?\n  \}\n\n  function drawWeight\(ctx, w, h, p\) \{', re.S)
          text, n = pattern.subn('\n  function drawWeight(ctx, w, h, p) {', text, count=1)
          if n != 1:
              raise SystemExit(f"generic-lab-simulator: expected one legacy renderer, removed {n}")
          p.write_text(text, encoding="utf-8")

          # One-shot workflow: do not leave remediation machinery in the repository.
          Path(".github/workflows/c04-cleanup.yml").unlink()

      - name: Commit C04 cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "C04: resolve lint and hook warnings"
          git push origin HEAD:audit-2026-c01-route-snapshot
