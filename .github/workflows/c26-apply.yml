name: C26 temporary payload apply

on:
  push:
    branches:
      - c26-v3-latex-certification
    paths:
      - '.c26_payload.part-*'
      - '.c26_apply.js'
      - '.github/workflows/c26-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c26-v3-latex-certification
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inspect payload fragments
        shell: bash
        run: |
          for f in .c26_payload.part-*; do
            wc -c "$f"
            sha256sum "$f"
          done
      - name: Rebuild verified payload
        shell: bash
        run: |
          cat .c26_payload.part-* > /tmp/c26-v3-payload.tar.gz
          echo "71b1c74220d91e1ab8e3ce3ede60474d2d40cfff795f408398b0dd96471e892a  /tmp/c26-v3-payload.tar.gz" | sha256sum -c -
          tar -xzf /tmp/c26-v3-payload.tar.gz -C .
      - name: Apply permanent guards
        run: node .c26_apply.js
      - name: Validate C26
        shell: bash
        run: |
          node scripts/audit-maths-v3-c26-latex.mjs
          npm ci --no-audit --fund=false
          npx tsx --test tests/c26-mathematiques-terminale-specialite-a.test.mjs
      - name: Commit migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Migrate C26 Terminale specialite part A to maths V3 LaTeX"
          git push origin HEAD:c26-v3-latex-certification
