name: C08 cycle 4 source migration

on:
  push:
    branches:
      - audit-2026-c01-route-snapshot

permissions:
  contents: write

jobs:
  migrate-cycle4:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: audit-2026-c01-route-snapshot
          fetch-depth: 0

      - name: Migrate cycle 4 metadata and tests
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json

          root = Path.cwd()
          old_id = "bo-college-physique-chimie-2025"
          new_id = "bo-cycle4-physique-chimie-2020"
          source = {
              "id": new_id,
              "label": "BO n° 31 du 30 juillet 2020 — Physique-Chimie, cycle 4",
              "kind": "official",
              "url": "https://www.education.gouv.fr/bo/20/Hebdo31/MENE2018714A.htm",
              "citation": "Programme de physique-chimie du cycle 4, arrêté du 17 juillet 2020, J.O. du 28 juillet 2020, BO n° 31 du 30 juillet 2020 (NOR MENE2018714A).",
          }

          meta_paths = []
          for niveau in ("5eme", "4eme", "3eme"):
              meta_paths.extend(sorted((root / "src/data/chapters/college" / niveau).glob("*/*/meta.json")))

          assert len(meta_paths) == 29, f"C08 attend 29 meta.json cycle 4, trouve {len(meta_paths)}"

          def replace_source_ids(value):
              if isinstance(value, dict):
                  for key, child in list(value.items()):
                      if key == "sourceIds" and isinstance(child, list):
                          value[key] = [new_id if item == old_id else item for item in child]
                      else:
                          replace_source_ids(child)
              elif isinstance(value, list):
                  for child in value:
                      replace_source_ids(child)

          for meta_path in meta_paths:
              data = json.loads(meta_path.read_text(encoding="utf-8"))
              data["sources"] = [dict(source)]
              replace_source_ids(data)
              encoded = json.dumps(data, ensure_ascii=False, indent=2) + "\n"
              assert old_id not in encoded, str(meta_path)
              meta_path.write_text(encoded, encoding="utf-8")

          test_56 = root / "tests/contenus-college-5e-6e-v3.test.mjs"
          text = test_56.read_text(encoding="utf-8")
          text = text.replace(
              'const CYCLE_4_LEGACY_SOURCE_ID = "bo-college-physique-chimie-2025";',
              'const CYCLE_4_SOURCE_ID = "bo-cycle4-physique-chimie-2020";',
          ).replace(
              '    : CYCLE_4_LEGACY_SOURCE_ID;',
              '    : CYCLE_4_SOURCE_ID;',
          )
          assert "CYCLE_4_LEGACY_SOURCE_ID" not in text
          test_56.write_text(text, encoding="utf-8")

          test_43 = root / "tests/contenus-college-4e-3e-v3.test.mjs"
          text = test_43.read_text(encoding="utf-8").replace(old_id, new_id)
          exact_resource_assertion = (
              'assert.ok(item.sources.some((source) => source.id === "bo-cycle4-physique-chimie-2020"), '
              '`${key}/${kind}/${item.id}`);'
          )
          official_resource_assertion = (
              'assert.ok(item.sources.some((source) => source.kind === "official"), '
              '`${key}/${kind}/${item.id}`);'
          )
          assert exact_resource_assertion in text
          text = text.replace(exact_resource_assertion, official_resource_assertion)
          test_43.write_text(text, encoding="utf-8")
          PY

          cat > tests/physique-chimie-cycle4-bo2020.test.mjs <<'EOF'
          import { describe, it } from "node:test";
          import assert from "node:assert/strict";
          import { existsSync, readFileSync, readdirSync } from "node:fs";
          import path from "node:path";

          const root = process.cwd();
          const SOURCE_ID = "bo-cycle4-physique-chimie-2020";
          const SOURCE_URL = "https://www.education.gouv.fr/bo/20/Hebdo31/MENE2018714A.htm";
          const LEGACY_SOURCE_ID = "bo-college-physique-chimie-2025";
          const levels = ["5eme", "4eme", "3eme"];
          const matieres = ["chimie", "physique"];

          function discoverMetaFiles() {
            const files = [];
            for (const niveau of levels) {
              for (const matiere of matieres) {
                const subjectDir = path.join(root, "src/data/chapters/college", niveau, matiere);
                for (const entry of readdirSync(subjectDir, { withFileTypes: true })) {
                  if (!entry.isDirectory()) continue;
                  const file = path.join(subjectDir, entry.name, "meta.json");
                  if (existsSync(file)) files.push({ niveau, matiere, slug: entry.name, file });
                }
              }
            }
            return files.sort((a, b) => a.file.localeCompare(b.file));
          }

          function load(record) {
            const raw = readFileSync(record.file, "utf8");
            return { raw, meta: JSON.parse(raw) };
          }

          describe("C08 — sources officielles Physique-Chimie cycle 4", () => {
            it("couvre exactement les 29 chapitres publies de 5e, 4e et 3e", () => {
              const files = discoverMetaFiles();
              assert.equal(files.length, 29);
              assert.equal(files.filter(({ niveau }) => niveau === "5eme").length, 8);
              assert.equal(files.filter(({ niveau }) => niveau === "4eme").length, 9);
              assert.equal(files.filter(({ niveau }) => niveau === "3eme").length, 12);
            });

            it("rattache chaque meta.json au BO n° 31 du 30 juillet 2020", () => {
              for (const record of discoverMetaFiles()) {
                const { raw, meta } = load(record);
                assert.equal(meta.sources?.length, 1, record.file);
                const source = meta.sources[0];
                assert.equal(source.id, SOURCE_ID, record.file);
                assert.equal(source.kind, "official", record.file);
                assert.equal(source.url, SOURCE_URL, record.file);
                assert.match(source.label, /BO n° 31 du 30 juillet 2020/, record.file);
                assert.match(source.label, /Physique-Chimie, cycle 4/, record.file);
                assert.match(source.citation, /arrêté du 17 juillet 2020/, record.file);
                assert.match(source.citation, /J\.O\. du 28 juillet 2020/, record.file);
                assert.match(source.citation, /MENE2018714A/, record.file);
                assert.doesNotMatch(raw, new RegExp(LEGACY_SOURCE_ID), record.file);
              }
            });

            it("utilise la meme source officielle dans tous les blocs de lecon du cycle 4", () => {
              for (const record of discoverMetaFiles()) {
                const { meta } = load(record);
                const blocks = (meta.lessons ?? []).flatMap((lesson) => lesson.blocks ?? []);
                assert.ok(blocks.length > 0, record.file);
                for (const block of blocks) {
                  assert.ok(block.sourceIds?.includes(SOURCE_ID), `${record.file}/${block.id}`);
                  assert.ok(!block.sourceIds?.includes(LEGACY_SOURCE_ID), `${record.file}/${block.id}`);
                }
              }
            });

            it("conserve les routes canoniques et la taxonomie des chapitres", () => {
              for (const record of discoverMetaFiles()) {
                const { meta } = load(record);
                assert.equal(meta.niveau, record.niveau, record.file);
                assert.equal(meta.matiere, record.matiere, record.file);
                assert.equal(meta.slug, record.slug, record.file);
                assert.equal(
                  meta.seo?.canonical,
                  `/college/${record.niveau}/${record.matiere}/${record.slug}`,
                  record.file,
                );
              }
            });

            it("laisse intact le referentiel Sciences et technologie de 6e etabli par C07", () => {
              const file = path.join(
                root,
                "src/data/chapters/college/6eme/chimie/etats-proprietes-matiere/meta.json",
              );
              const sixieme = JSON.parse(readFileSync(file, "utf8"));
              assert.equal(sixieme.sources?.[0]?.id, "bo-cycle3-sciences-technologie-2023");
              assert.notEqual(sixieme.sources?.[0]?.id, SOURCE_ID);
            });
          });
          EOF

      - name: Validate migration diff
        shell: bash
        run: |
          test "$(find src/data/chapters/college/{5eme,4eme,3eme} -name meta.json | wc -l)" -eq 29
          ! grep -R "bo-college-physique-chimie-2025" \
            src/data/chapters/college/5eme/*/*/meta.json \
            src/data/chapters/college/4eme/*/*/meta.json \
            src/data/chapters/college/3eme/*/*/meta.json
          node --check tests/physique-chimie-cycle4-bo2020.test.mjs
          git diff --check

      - name: Commit final C08 migration and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/c08-source-export.yml
          git add src/data/chapters/college/5eme src/data/chapters/college/4eme src/data/chapters/college/3eme
          git add tests/contenus-college-5e-6e-v3.test.mjs tests/contenus-college-4e-3e-v3.test.mjs tests/physique-chimie-cycle4-bo2020.test.mjs
          git diff --cached --check
          git commit -m "C08: align cycle 4 sources with BO 2020"
          git push origin HEAD:audit-2026-c01-route-snapshot
