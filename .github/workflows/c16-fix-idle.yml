name: C16 fix idle fallback

on:
  push:
    branches:
      - audit-2026-c01-route-snapshot
    paths:
      - .github/workflows/c16-fix-idle.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-2026-c01-route-snapshot
          fetch-depth: 0
      - name: Patch idle fallback
        shell: python
        run: |
          from pathlib import Path
          path = Path("src/components/ui/GlobalClientTools.astro")
          text = path.read_text(encoding="utf-8")
          old = '''  const scheduleIdle = (callback: () => void) => {
    if ("requestIdleCallback" in window) {
      window.requestIdleCallback(callback, { timeout: 1500 });
    } else {
      window.setTimeout(callback, 250);
    }
  };'''
          new = '''  const scheduleIdle = (callback: () => void) => {
    if (typeof window.requestIdleCallback === "function") {
      window.requestIdleCallback(callback, { timeout: 1500 });
      return;
    }
    globalThis.setTimeout(callback, 250);
  };'''
          if old not in text:
              raise SystemExit("C16: idle fallback block not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
      - name: Self-clean and commit
        run: |
          rm .github/workflows/c16-fix-idle.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/ui/GlobalClientTools.astro .github/workflows/c16-fix-idle.yml
          git commit -m "C16: use typed idle fallback"
          git push
