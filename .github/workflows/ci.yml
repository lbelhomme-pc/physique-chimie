name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # These three job names are part of the branch-protection contract.
  # Keep them stable unless the required checks on `main` are updated at the same time.
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Bootstrap C17 modular CSS migration
        if: github.event_name == 'push' && github.event.head_commit.message == 'C17: bootstrap modular CSS migration'
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/styles/design-system.css')
          original = path.read_text(encoding='utf-8')
          assert len(original.encode()) > 65000, 'design-system.css is not the expected C16 monolith'
          assert '@import "./tokens-v3.css";' in original

          text = original
          replacements = {
              '--text-muted: #8896a6;': '--text-muted: #58677a;',
              '--text-muted: #9ca3af;': '--text-muted: #c5ccd6;',
              '--text-muted: #8b7355;': '--text-muted: #766249;',
              '--text-muted: #a08060;': '--text-muted: #b59673;',
              '--accent-success: #10b981;': '--accent-success: #047857;',
              '--accent-danger: #ef4444;': '--accent-danger: #b91c1c;',
              '--accent-purple: #8b5cf6;': '--accent-purple: #6d28d9;',
              'color: #b8860b;': 'color: var(--accent-rank);',
          }
          expected_counts = {
              '--text-muted: #8896a6;': 2,
              '--text-muted: #9ca3af;': 1,
              '--text-muted: #8b7355;': 1,
              '--text-muted: #a08060;': 1,
              '--accent-success: #10b981;': 1,
              '--accent-danger: #ef4444;': 1,
              '--accent-purple: #8b5cf6;': 1,
              'color: #b8860b;': 1,
          }
          for old, new in replacements.items():
              count = text.count(old)
              assert count == expected_counts[old], f'unexpected count for {old!r}: {count}'
              text = text.replace(old, new)

          target = '.box-regle-or h3 {\n  color: #dc2626;'
          assert text.count(target) == 1
          text = text.replace(target, '.box-regle-or h3 {\n  color: var(--accent-danger);')

          root_anchor = '  --accent-orange: #f97316;\n'
          assert text.count(root_anchor) == 1
          text = text.replace(root_anchor, root_anchor + '  --accent-rank: #765600;\n')

          gray_anchor = '  --accent-primary-light: #2a2f5f;\n'
          assert text.count(gray_anchor) == 1
          text = text.replace(gray_anchor, gray_anchor + '  --accent-rank: #facc15;\n')

          dark_anchor = '  --accent-purple-light: #2e1065;\n'
          assert text.count(dark_anchor) == 1
          text = text.replace(dark_anchor, dark_anchor + '  --accent-rank: #facc15;\n')

          blue_anchor = '  --accent-primary-light: #3a2a10;\n'
          assert text.count(blue_anchor) == 1
          text = text.replace(blue_anchor, blue_anchor + '  --accent-rank: #facc15;\n')

          def section(label):
              needle = f'   {label}\n'
              i = text.index(needle)
              start = text.rfind('/*', 0, i)
              assert start >= 0
              return start

          theme_start = section('VARIABLES — THÈME CLAIR (défaut)')
          global_start = section('GLOBAL')
          nav_start = section('NAVIGATION — Barre de pills avec emojis')
          course_start = section('COURS MDX — Contenu principal')
          animations_start = section('ANIMATIONS (désactivables via a11y)')
          reference_start = text.index('/* Reference UI V3 - couche commune pour les pages publiques */')
          assert theme_start < global_start < nav_start < course_start < animations_start < reference_start

          modules = {
              'theme.css': text[theme_start:global_start],
              'core.css': text[global_start:nav_start],
              'components.css': text[nav_start:course_start],
              'course-content.css': text[course_start:animations_start],
              'utilities.css': text[animations_start:reference_start],
              'reference-v3.css': text[reference_start:],
          }
          assert ''.join(modules.values()) == text[theme_start:], 'CSS split changed rule order or contents'
          for name, content in modules.items():
              assert content.strip(), f'{name} empty'
              Path('src/styles', name).write_text(content, encoding='utf-8')

          path.write_text('''/* src/styles/design-system.css */
/* Point d'entree du design system V3 — cascade modulaire C17. */
/* L'ordre des imports preserve exactement l'ordre de cascade historique. */

@import "./tokens-v3.css";
@import "./theme.css";
@import "./core.css";
@import "./components.css";
@import "./course-content.css";
@import "./utilities.css";
@import "./reference-v3.css";
''', encoding='utf-8')

          test = r'''import test from "node:test";
import assert from "node:assert/strict";
import fs from "node:fs";
import path from "node:path";

const root = process.cwd();
const read = (file) => fs.readFileSync(path.join(root, file), "utf8");
const entry = read("src/styles/design-system.css");
const moduleNames = ["theme.css", "core.css", "components.css", "course-content.css", "utilities.css", "reference-v3.css"];
const modules = Object.fromEntries(moduleNames.map((name) => [name, read(`src/styles/${name}`)]));
const theme = modules["theme.css"];
const components = modules["components.css"];
const reference = modules["reference-v3.css"];

function luminance(hex) {
  const clean = hex.replace("#", "");
  const rgb = [0, 2, 4].map((offset) => parseInt(clean.slice(offset, offset + 2), 16) / 255);
  const linear = rgb.map((value) => value <= 0.04045 ? value / 12.92 : ((value + 0.055) / 1.055) ** 2.4);
  return 0.2126 * linear[0] + 0.7152 * linear[1] + 0.0722 * linear[2];
}
function contrast(foreground, background) {
  const a = luminance(foreground);
  const b = luminance(background);
  return (Math.max(a, b) + 0.05) / (Math.min(a, b) + 0.05);
}
function varsFromBody(body) {
  return Object.fromEntries([...body.matchAll(/(--[a-z0-9-]+):\s*(#[0-9a-f]{6})\s*;/gi)].map((match) => [match[1], match[2].toLowerCase()]));
}
function blockVars(selectorPattern) {
  const match = theme.match(new RegExp(`${selectorPattern}\\s*\\{([\\s\\S]*?)\\n\\}`, "i"));
  assert.ok(match, `theme block missing: ${selectorPattern}`);
  return varsFromBody(match[1]);
}
const light = blockVars(":root,\\s*\\.a11y-theme-light");
const themeOverrides = {
  light: {},
  "gray-light": blockVars("\\.a11y-theme-gray-light"),
  gray: blockVars("\\.a11y-theme-gray"),
  dark: blockVars("\\.a11y-theme-dark"),
  sepia: blockVars("\\.a11y-theme-sepia"),
  "blue-light": blockVars("\\.a11y-theme-blue-light"),
};
const resolvedTheme = (name) => ({ ...light, ...themeOverrides[name] });
function assertAA(label, foreground, background, threshold = 4.5) {
  const ratio = contrast(foreground, background);
  assert.ok(ratio >= threshold, `${label}: ${ratio.toFixed(2)} < ${threshold} (${foreground} / ${background})`);
}

test("C17 design-system entrypoint is modular and preserves explicit cascade order", () => {
  const expected = [
    '@import "./tokens-v3.css";', '@import "./theme.css";', '@import "./core.css";',
    '@import "./components.css";', '@import "./course-content.css";', '@import "./utilities.css";',
    '@import "./reference-v3.css";'
  ];
  let cursor = -1;
  for (const statement of expected) {
    const index = entry.indexOf(statement);
    assert.ok(index > cursor, `missing or misordered import: ${statement}`);
    cursor = index;
  }
  assert.doesNotMatch(entry.replace(/\/\*[\s\S]*?\*\//g, ""), /\{/);
  assert.ok(Buffer.byteLength(entry) < 1000);
  for (const name of moduleNames) {
    const bytes = Buffer.byteLength(modules[name]);
    assert.ok(bytes > 200, `${name} unexpectedly empty`);
    assert.ok(bytes < 35_000, `${name} still monolithic: ${bytes} bytes`);
  }
});

test("C17 keeps representative legacy and V3 selectors after the split", () => {
  const all = moduleNames.map((name) => modules[name]).join("\n");
  for (const selector of [".main-nav", ".breadcrumb-bar", ".card-chapitre", ".tabs-bar", ".cours-content", ".formule-box", ".retenir-box", ".om-entry-card", ".chapter-hero-v3", ".student-dashboard-card"]) {
    assert.match(all, new RegExp(selector.replace(".", "\\.")));
  }
  assert.match(reference, /Reference UI V3/);
});

test("C17 all accessibility themes keep normal text and muted text at WCAG AA contrast", () => {
  for (const name of Object.keys(themeOverrides)) {
    const vars = resolvedTheme(name);
    for (const textVar of ["--text-primary", "--text-secondary", "--text-muted"]) {
      assertAA(`${name} ${textVar} on card`, vars[textVar], vars["--bg-card"]);
      assertAA(`${name} ${textVar} on body`, vars[textVar], vars["--bg-body"]);
    }
  }
});

test("C17 semantic accent text keeps WCAG AA contrast on its semantic surface", () => {
  for (const name of Object.keys(themeOverrides)) {
    const vars = resolvedTheme(name);
    for (const [accent, surface] of [["--accent-primary", "--accent-primary-light"], ["--accent-success", "--accent-success-light"], ["--accent-danger", "--accent-danger-light"], ["--accent-purple", "--accent-purple-light"]]) {
      assertAA(`${name} ${accent}`, vars[accent], vars[surface]);
    }
    assertAA(`${name} rank`, vars["--accent-rank"], vars["--bg-card"]);
  }
});

test("C17 reference UI V3 core color pairs meet WCAG AA", () => {
  assertAA("reference muted", "#53627d", "#ffffff");
  assertAA("reference cyan badge", "#066684", "#eff7ff");
  assertAA("reference primary button", "#ffffff", "#1457ee");
  assert.match(reference, /--ref-muted:\s*#53627d/);
  assert.match(reference, /color:\s*#066684/);
});

test("C17 known low-contrast legacy colors are removed from text roles", () => {
  const all = `${theme}\n${components}`;
  assert.doesNotMatch(all, /--text-muted:\s*#8896a6/i);
  assert.doesNotMatch(all, /--text-muted:\s*#9ca3af/i);
  assert.doesNotMatch(all, /color:\s*#b8860b/i);
  assert.match(components, /\.rang-pill[\s\S]*color:\s*var\(--accent-rank\)/);
  assert.match(components, /\.box-regle-or h3[\s\S]*color:\s*var\(--accent-danger\)/);
});
'''
          Path('tests/css-modular-c17.test.mjs').write_text(test, encoding='utf-8')
          PY

          node --test tests/css-modular-c17.test.mjs
          git show HEAD^:.github/workflows/ci.yml > .github/workflows/ci.yml
          git config user.name "lbelhomme-pc"
          git config user.email "269287272+lbelhomme-pc@users.noreply.github.com"
          git add src/styles tests/css-modular-c17.test.mjs .github/workflows/ci.yml
          git commit -m "C17: modularize V3 CSS and enforce contrast"
          git push origin HEAD:audit-2026-c01-route-snapshot

      - name: Install locked dependencies
        run: npm ci

      - name: Quality checks
        run: npm run ci:quality

  dist-fast:
    name: dist-fast
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build and fast dist audit
        run: npm run ci:dist

  dist-a11y:
    name: dist-a11y
    runs-on: ubuntu-latest
    # Accessibility is authoritative in its own right: it must not be skipped
    # merely because the fast dist audit failed.
    needs: quality
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build and accessibility sample audit
        run: npm run ci:a11y
