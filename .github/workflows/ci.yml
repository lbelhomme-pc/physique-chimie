name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Execute C17 migration
        if: github.event_name == 'push' && contains(github.event.head_commit.message, 'execute modular CSS migration')
        run: |
          python scripts/c17-migrate.py
          node --test tests/css-modular-c17.test.mjs
          git show f925ebeef46967b0622eb0f886d2addc479fab80:.github/workflows/ci.yml > .github/workflows/ci.yml
          git config user.name "lbelhomme-pc"
          git config user.email "269287272+lbelhomme-pc@users.noreply.github.com"
          git add src/styles tests/css-modular-c17.test.mjs scripts/c17-migrate.py .github/workflows/ci.yml
          git commit -m "C17 modularize V3 CSS and enforce contrast"
          git push origin HEAD:audit-2026-c01-route-snapshot

      - name: Install locked dependencies
        run: npm ci

      - name: Quality checks
        run: npm run ci:quality

  dist-fast:
    name: dist-fast
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build and fast dist audit
        run: npm run ci:dist

  dist-a11y:
    name: dist-a11y
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build and accessibility sample audit
        run: npm run ci:a11y
