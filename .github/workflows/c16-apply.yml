name: C16 wire native global shell

on:
  push:
    branches:
      - audit-2026-c01-route-snapshot
    paths:
      - .github/workflows/c16-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-2026-c01-route-snapshot
          fetch-depth: 0

      - name: Replace global React islands
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/layouts/BaseLayout.astro")
          text = path.read_text(encoding="utf-8")

          old_imports = "\n".join([
              'import DailyLoginTracker from "../components/pedagogie/DailyLoginTracker.tsx";',
              'import AccessibilityPanel from "../components/accessibility/AccessibilityPanel.tsx";',
              'import ReadingGuide from "../components/accessibility/ReadingGuide.tsx";',
              'import ScrollToTop from "../components/ui/ScrollToTop.tsx";',
          ])
          new_imports = "\n".join([
              'import A11yHeadBootstrap from "../components/accessibility/A11yHeadBootstrap.astro";',
              'import GlobalClientTools from "../components/ui/GlobalClientTools.astro";',
          ])
          if old_imports not in text:
              raise SystemExit("C16: expected global React import block not found")
          text = text.replace(old_imports, new_imports, 1)

          manifest = '  <link rel="manifest" href={siteConfig.assets.manifest}>'
          if manifest not in text:
              raise SystemExit("C16: manifest anchor not found")
          text = text.replace(manifest, '  <A11yHeadBootstrap />\n\n' + manifest, 1)

          old_islands = "\n".join([
              "  <!-- Composants globaux -->",
              "  <DailyLoginTracker client:load />",
              "  <AccessibilityPanel client:load />",
              "  <ReadingGuide client:load />",
              "  <ScrollToTop client:load />",
          ])
          new_shell = "\n".join([
              "  <!-- Outils globaux C16 : natifs, panneau accessibilité chargé à la demande -->",
              "  <GlobalClientTools />",
          ])
          if old_islands not in text:
              raise SystemExit("C16: expected global island block not found")
          text = text.replace(old_islands, new_shell, 1)

          if "client:load" in text:
              raise SystemExit("C16: BaseLayout still contains client:load")
          for legacy in ("DailyLoginTracker", "AccessibilityPanel client:", "ReadingGuide client:", "ScrollToTop client:"):
              if legacy in text:
                  raise SystemExit(f"C16: legacy global island reference remains: {legacy}")

          path.write_text(text, encoding="utf-8")

      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/c16-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/layouts/BaseLayout.astro .github/workflows/c16-apply.yml
          git commit -m "C16: remove global client-load React islands"
          git push
