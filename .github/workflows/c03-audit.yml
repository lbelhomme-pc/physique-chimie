name: C03 dependency audit

on:
  push:
    branches:
      - audit-2026-c01-route-snapshot

permissions:
  contents: read

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Print npm audit report
        shell: bash
        run: |
          set +e
          npm audit --json > npm-audit.json
          code=$?
          cat npm-audit.json
          exit 0
