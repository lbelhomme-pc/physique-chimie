name: C03 Astro 7 preflight

on:
  push:
    branches:
      - audit-2026-c01-route-snapshot

permissions:
  contents: read

jobs:
  astro7-preflight:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install current locked dependencies
        run: npm ci

      - name: Prepare Astro 7 dependency set
        shell: bash
        run: |
          npm pkg set engines.node='>=22.12.0'
          npm pkg set dependencies.astro='^7.2.9'
          npm pkg set dependencies.'@astrojs/mdx'='^7.0.8'
          npm pkg set dependencies.'@astrojs/react'='^6.0.4'
          npm pkg set dependencies.'@astrojs/sitemap'='^3.7.3'
          npm pkg set devDependencies.'@astrojs/check'='^0.9.10'
          npm install

      - name: Audit candidate dependency graph
        shell: bash
        run: |
          npm audit --json > npm-audit.json || true
          node - <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('npm-audit.json', 'utf8'));
          console.log('AUDIT_CANDIDATE', JSON.stringify(report.metadata?.vulnerabilities ?? {}));
          for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
            console.log(`VULN_CANDIDATE ${name} severity=${item.severity} range=${item.range}`);
          }
          NODE

      - name: Astro check with candidate graph
        run: npm run check

      - name: Production build with candidate graph
        run: npm run build
