name: C03 Astro 7 migration

on:
  push:
    branches:
      - audit-2026-c01-route-snapshot

permissions:
  contents: write

jobs:
  migrate-astro7:
    if: "${{ github.event.head_commit.message == 'C03: stage Astro 7 secure migration' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install current locked dependencies
        run: npm ci

      - name: Upgrade Astro stack and Node contract
        shell: bash
        run: |
          npm pkg set engines.node='>=22.19.0'
          npm pkg set dependencies.astro='^7.2.9'
          npm pkg set dependencies.'@astrojs/mdx'='^7.0.8'
          npm pkg set dependencies.'@astrojs/react'='^6.0.4'
          npm pkg set dependencies.'@astrojs/sitemap'='^3.7.3'
          npm pkg set devDependencies.'@astrojs/check'='^0.9.10'
          npm install

      - name: Require zero npm vulnerabilities
        shell: bash
        run: |
          npm audit --json > npm-audit.json || true
          node - <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('npm-audit.json', 'utf8'));
          const vulnerabilities = report.metadata?.vulnerabilities ?? {};
          console.log('AUDIT_FINAL_CANDIDATE', JSON.stringify(vulnerabilities));
          if ((vulnerabilities.total ?? 0) !== 0) {
            process.exit(1);
          }
          NODE

      - name: Validate Astro types
        run: npm run check

      - name: Validate production build
        run: npm run build

      - name: Commit secure dependency graph
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo 'No dependency changes to commit.'
            exit 0
          fi
          git commit -m 'C03: upgrade Astro stack to secure versions'
          git push origin HEAD:audit-2026-c01-route-snapshot
