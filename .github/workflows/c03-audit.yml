name: C03 dependency audit

on:
  push:
    branches:
      - audit-2026-c01-route-snapshot

permissions:
  contents: read

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Inspect Astro 7 package compatibility
        shell: bash
        run: |
          echo '--- astro@7.2.9 ---'
          npm view astro@7.2.9 version engines peerDependencies
          echo '--- @astrojs/mdx@7.0.8 ---'
          npm view @astrojs/mdx@7.0.8 version engines peerDependencies
          echo '--- @astrojs/react@6.0.4 ---'
          npm view @astrojs/react@6.0.4 version engines peerDependencies
          echo '--- @astrojs/sitemap@3.7.3 ---'
          npm view @astrojs/sitemap@3.7.3 version engines peerDependencies
          echo '--- @astrojs/check@0.9.10 ---'
          npm view @astrojs/check@0.9.10 version engines peerDependencies

      - name: Print current npm audit summary
        shell: bash
        run: |
          set +e
          npm audit --json > npm-audit.json
          node -e "const r=require('./npm-audit.json'); console.log(JSON.stringify(r.metadata.vulnerabilities, null, 2));"
          exit 0
